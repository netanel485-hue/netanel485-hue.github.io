<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>TTS-DIAG running</title></head>
<body><h1>TTS diagnostic (temporary)</h1><pre id="out">RUNNING…</pre>
<script>
const R = [];
function log(s){ R.push(s); document.getElementById('out').textContent = R.join('\n'); }
const U = "https://translate.google.com/translate_tts?ie=UTF-8&tl=he&client=tw-ob&q=" + encodeURIComponent("שלום אורי");
function audioTest(name, useNoRef){
  return new Promise((resolve)=>{
    const a = new Audio();
    log(name + ": 'referrerPolicy' in audio = " + ('referrerPolicy' in a));
    if(useNoRef){ try{ a.referrerPolicy = "no-referrer"; }catch(e){ log(name+": set threw "+e); } log(name+": referrerPolicy after set = " + a.referrerPolicy); }
    a.src = U;
    let done=false;
    const fin=(s)=>{ if(done)return; done=true; log(name+": "+s); resolve(); };
    const to=setTimeout(()=>fin("TIMEOUT 15s (no loadedmetadata, no error)"),15000);
    a.addEventListener("loadedmetadata", ()=>{ clearTimeout(to); log(name+": loadedmetadata duration="+a.duration.toFixed(2)+"s"); const pr=a.play(); if(pr&&pr.then){ pr.then(()=>fin("play() RESOLVED (playing)")).catch((e)=>fin("play() REJECTED: "+(e&&e.name)+" "+(e&&e.message))); } else fin("play() no promise"); });
    a.addEventListener("error", ()=>{ clearTimeout(to); fin("ERROR code="+(a.error&&a.error.code)+" (1=aborted 2=network 3=decode 4=src-not-supported)"); });
    a.load();
  });
}
(async ()=>{
  log("UA: "+navigator.userAgent);
  await audioTest("A-default", false);
  await audioTest("B-no-referrer", true);
  try{ const r = await fetch(U, {mode:"cors", referrerPolicy:"no-referrer"}); log("C-fetch-cors: resolved ok="+r.ok+" status="+r.status+" type="+r.type); }
  catch(e){ log("C-fetch-cors: REJECTED "+e.name+" "+e.message); }
  try{
    const vs = (window.speechSynthesis?speechSynthesis.getVoices():[]);
    const he = vs.filter(v=>/^he/i.test(v.lang||""));
    log("D-voices: total="+vs.length+" hebrew="+he.length+" ["+he.map(v=>v.lang+"|"+v.name).join("; ")+"]");
    const spoken = await new Promise((res)=>{ const u=new SpeechSynthesisUtterance("שלום"); u.lang="he-IL"; u.onend=()=>res("onend"); u.onerror=(e)=>res("onerror "+(e&&e.error)); setTimeout(()=>res("TIMEOUT 6s no onend/onerror"),6000); try{ speechSynthesis.speak(u); }catch(e){ res("speak threw "+e); } });
    log("D-speak-test: "+spoken);
  }catch(e){ log("D-voices error: "+e); }
  log("DONE");
  document.title = "TTS-DIAG DONE";
})();
</script></body></html>
