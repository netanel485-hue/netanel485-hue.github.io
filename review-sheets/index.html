<style>
/* DESIGN-TOKENS-START */
/* ==========================================================================
   DESIGN TOKENS — מקור אמת אחד לכל מוצרי הלמידה
   --------------------------------------------------------------------------
   הפלטה הקנונית היא פלטת grade6 אחרי העיצוב המחודש (8/11/2026):
   רקע קרם, כרטיסים ירוקים בהירים, טקסט ירוק כהה, מבטא אחד צהוב-כתום.
   הערכים כאן מועתקים בדיוק מ־grade6 — אין לעצב מחדש בקובץ הזה.

   כלל ברזל: לא עורכים את הבלוק המוזרק בתוך קובץ מוצר.
   שינוי טוקן נעשה כאן בלבד, ואז מריצים:
     node ~/workspace/hub-audit/inject-tokens.js <קובץ מוצר>
   ובודקים סטייה לפני כל פרסום:
     node ~/workspace/hub-audit/check-tokens-drift.js
   אין תלות ריצה: אחרי ההזרקה הטוקנים חיים בתוך כל קובץ מוצר.
   אין פונטים חיצוניים, אין URL-ים, אין תמונות.
   ========================================================================== */

:root {
  /* --- צבעי רקע --- */
  --bg: #FAF6EB;          /* רקע הדף — קרם */
  --bar: #FFFDF7;         /* סרגל עליון — קרם בהיר יותר */
  --card: #EAF4E6;        /* כרטיס — ירוק בהיר רך */
  --card-focus: #FFFFFF;  /* כרטיס במוקד (שאלה פעילה) — לבן */

  /* --- צבעי טקסט --- */
  --ink: #1E4634;         /* טקסט ראשי — ירוק כהה */
  --ink-soft: #4F6B5D;    /* טקסט משני — ירוק-אפור */
  --muted: #7A8B7F;       /* טקסט חלש / כיתוב קטן */

  /* --- קווים וגבולות --- */
  --line: #D8E4D4;        /* גבול כרטיסים וכפתורים */

  /* --- מבטא — צהוב-כתום אחד בלבד --- */
  --accent: #F59E0B;      /* מבטא ראשי (מוקד, פס התקדמות) */
  --accent-deep: #D97706; /* מבטא כהה — כפתורים ראשיים */
  --accent-soft: #FDF3DC; /* רקע רך למבטא (בחירה, טיפ) */

  /* --- מצבים: הצלחה / שגיאה / אזהרה --- */
  --good: #2E7D4F;        /* ירוק הצלחה */
  --good-bg: #DFF0E3;     /* רקע הצלחה */
  --bad: #B3382E;         /* אדום שגיאה */
  --bad-bg: #FBE7E3;      /* רקע שגיאה */
  /* אזהרה: אין גוון חדש בפלטה — משתמשים במשפחת המבטא בלבד */
  --warn: #D97706;        /* = --accent-deep */
  --warn-bg: #FDF3DC;     /* = --accent-soft */

  /* --- מצב מושבת (מועתק מחוקי הכפתורים ב־grade6) --- */
  --disabled-bg: #E7EDE6;
  --disabled-ink: #8A9A8F;

  /* --- צל --- */
  --shadow-card: 0 2px 12px rgba(30, 70, 50, .08);

  /* --- רדיוסים (מועתקים מ־grade6) --- */
  --radius-card: 24px;    /* כרטיס גדול */
  --radius-md: 20px;      /* כרטיס נושא / חלונית */
  --radius-btn: 16px;     /* כפתור ואפשרות תשובה */
  --radius-sm: 12px;      /* שדה קלט / משוב */
  --radius-pill: 999px;   /* צ'יפ / פס התקדמות */

  /* --- מרווחים (סקאלה, מבוססת על הערכים הנפוצים ב־grade6) --- */
  --sp-xs: 8px;
  --sp-sm: 12px;
  --sp-md: 16px;
  --sp-lg: 20px;
  --sp-xl: 28px;
}

/* ==========================================================================
   שפת כפתורים משותפת — class-ים עצמאיים, לא דורסים class-ים קיימים.
   .btn-primary / .btn-secondary / .btn-ghost / .btn-danger הם שמות חדשים
   (אין אף מוצר שמגדיר אותם היום), והערכים מועתקים מ־grade6:
   .btn-primary = .btn-main, .btn-secondary = .btn, .btn-ghost = .btn-ghost.
   כפתור מסוכן (.btn-danger) חדש — משתמש ב־--bad הקיים, בלי גוון חדש.
   ========================================================================== */

/* בסיס משותף לכל הכפתורים */
.btn-primary,
.btn-secondary,
.btn-ghost,
.btn-danger {
  display: inline-block;
  border-radius: var(--radius-btn);
  padding: 13px 26px;
  font-size: 16px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  min-height: 52px;
  touch-action: manipulation;
  text-align: center;
}

/* ראשי — הפעולה החשובה בעמוד (התחל / בדוק / המשך) */
.btn-primary {
  background: var(--accent-deep);
  color: #fff;
  border: none;
  font-size: 17px;
  font-weight: 800;
  min-height: 54px;
  padding: 14px 28px;
}

/* משני — פעולה רגילה (חזרה / דלג / ביטול) */
.btn-secondary {
  background: #FFFFFF;
  color: var(--ink);
  border: 2px solid var(--line);
}

/* שקט — פעולה זניחה, בלי מסגרת בולטת (סגירה / פרטים) */
.btn-ghost {
  background: transparent;
  border: 2px solid var(--line);
  color: var(--ink-soft);
  padding: 10px 16px;
  font-size: 15px;
  min-height: 48px;
}

/* מסוכן — פעולה הרסנית / בלתי הפיכה (מחיקת פרופיל) */
.btn-danger {
  background: var(--bad);
  color: #fff;
  border: none;
}

/* מצב מושבת — זהה לכל הכפתורים */
.btn-primary:disabled,
.btn-secondary:disabled,
.btn-ghost:disabled,
.btn-danger:disabled {
  background: var(--disabled-bg);
  color: var(--disabled-ink);
  border: 2px solid var(--disabled-bg);
  cursor: not-allowed;
}

/* מוקד מקלדת נראה — אותו כלל כמו ב־grade6 */
button:focus-visible,
select:focus-visible,
input:focus-visible,
textarea:focus-visible,
a:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
/* DESIGN-TOKENS-END */
</style>

<script id="rs-gen">
/* מחולל דפי חזרה בשברים: 8 עמודים באותו מבנה של דפי החזרה מהכיתה; משתנים רק המספרים וההקשר. */
var R, LOG;
function rng(s){let a=s>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const divs=n=>{const o=[];for(let i=1;i<=n;i++)if(n%i===0)o.push(i);return o;};
function Q(n,d){if(d===undefined)d=1;if(d<0){n=-n;d=-d;}const g=gcd(n,d)||1;return{n:n/g,d:d/g};}
const add=(x,y)=>Q(x.n*y.d+y.n*x.d,x.d*y.d), sub=(x,y)=>Q(x.n*y.d-y.n*x.d,x.d*y.d),
      mul=(x,y)=>Q(x.n*y.n,x.d*y.d), dv=(x,y)=>Q(x.n*y.d,x.d*y.n), cmp=(x,y)=>Math.sign(x.n*y.d-y.n*x.d);
const LET='אבגדהוזחטי';
const fr=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const mx=(w,n,d)=>`<span class="mx">${w}${fr(n,d)}</span>`;
const LT=s=>`<span class="ex" dir="ltr">${s}</span>`;
function qv(q){if(q.d===1)return''+q.n;const w=Math.floor(q.n/q.d),r=q.n-w*q.d;return LT(w?mx(w,r,q.d):fr(r,q.d));}
function qk(n,d){const q=Q(n,d);if(d===1)return''+n;const raw=fr(n,d),red=qv(q);return LT((q.n===n&&q.d===d&&n<d)?raw:raw+' = '+red);}
const py=q=>`F(${q.n},${q.d})`;
const xs=q=>q.n+'/'+q.d;
const BL=c=>`<span class="bl ${c||''}"></span>`;
const BX='<span class="bx"></span>';
const gb=s=>`<span class="gb">${s}</span>`;
const ex=(s,x)=>`<span class="ex" dir="ltr"${x!==undefined?` data-x="${x}"`:''}>${s}</span>`;
const it=(i,s)=>`<div class="it"><b>${LET[i]}</b>${s}</div>`;
const qh=(n,t)=>`<div class="qh"><span class="qn"><span>${n}</span></span><span>${t}</span></div>`;
function lg(k,chk,x,p){LOG.push({k,chk,x:x?[x.n,x.d]:null,p:p||''});}
function pickWhile(f){for(let i=0;i<5000;i++){const v=f();if(v)return v;}throw new Error('gen fail');}

/* ---------- SVG ---------- */
function sF(x,y,n,d,fs){fs=fs||14;const w=Math.max(String(n).length,String(d).length)*fs*.34+3;
  return `<text x="${x}" y="${y-3}" text-anchor="middle" font-size="${fs}">${n}</text><line x1="${x-w}" x2="${x+w}" y1="${y+1}" y2="${y+1}" stroke="#111" stroke-width="1.3"/><text x="${x}" y="${y+fs+2}" text-anchor="middle" font-size="${fs}">${d}</text>`;}
function sQ(x,y,q,fs){fs=fs||14;if(q.d===1)return `<text x="${x}" y="${y+fs*.4}" text-anchor="middle" font-size="${fs+2}">${q.n}</text>`;
  const w=Math.floor(q.n/q.d),r=q.n-w*q.d;if(!w)return sF(x,y,r,q.d,fs);
  return `<text x="${x-6}" y="${y+fs*.4}" text-anchor="end" font-size="${fs+2}">${w}</text>`+sF(x+4,y,r,q.d,fs);}
function svgShelf(n,a,b){const W=n*56+24;let s=`<svg viewBox="0 0 ${W} 150" width="${Math.min(W*1.1,280)}" font-family="Arial">`;
  for(let i=0;i<n;i++){const x=12+i*56,cx=x+26;
    s+=`<rect x="${x+16}" y="10" width="20" height="9" rx="2" fill="#888"/><rect x="${x+18}" y="18" width="16" height="12" fill="#ccc" stroke="#333"/>`+
       `<rect x="${x+2}" y="28" width="48" height="98" rx="11" fill="#e9e9e9" stroke="#333" stroke-width="1.3"/>`+
       `<circle cx="${cx}" cy="78" r="20" fill="#fff" stroke="#333"/>`+sF(cx+6,76,a,b,12)+`<text x="${cx-10}" y="82" text-anchor="middle" font-size="11">ל׳</text>`;}
  return s+`<rect x="2" y="126" width="${W-4}" height="9" fill="#9b7b55" stroke="#333"/><rect x="14" y="135" width="8" height="12" fill="#9b7b55"/><rect x="${W-22}" y="135" width="8" height="12" fill="#9b7b55"/></svg>`;}
function svgJug(a,b){const H=170,top=34,x1=62,x2=142,seg=H/b;let s=`<svg viewBox="0 0 160 225" width="178" font-family="Arial">`;
  s+=`<path d="M${x1} ${top+6} q-14 -2 -12 18 q2 14 12 14" fill="none" stroke="#333"/><path d="M${x2} ${top+6} q14 -2 12 18 q-2 14 -12 14" fill="none" stroke="#333"/>`;
  for(let i=0;i<b;i++){const y=top+H-(i+1)*seg;s+=`<rect x="${x1}" y="${y}" width="${x2-x1}" height="${seg}" fill="${i<a?'#9a9a9a':'#fff'}" stroke="#333" stroke-width=".9"/>`;}

  L.push(pickWhile(()=>{const b=pick([3,5,7]);return{m:2,s:Q(1,b),end:Q(2,b)};}));
  L.push(pickWhile(()=>{const N=pick([6,7,8,9,11,12,13,14]);return{m:5,s:Q(N,5),end:Q(N)};}));
  L.push(pickWhile(()=>{const b=pick([3,5,7]),c=ri(1,b-1);return 4*c>b&&(4*c)%b&&{m:4,s:Q(c,b),end:Q(4*c,b)};}));
  let h=qh(8,'על כל ישר מספרים מסומנות קפיצות שוות. מצאו את המספרים המתאימים לנקודות המסומנות.')+'<div class="lines">'+L.map((l,i)=>{
    lg('nl',`X*${l.m} == ${py(l.end)}`,l.s,[l.m,l.end.n,l.end.d]);
    key.push(`8${LET[i]}: ${Array.from({length:l.m-1},(_,j)=>qv(mul(l.s,Q(j+1)))).join(' , ')}`);
    return `<div class="ln"><b>${LET[i]}</b>${l.raw?svgLineRaw(l):svgLine(l.m,l.end,true)}</div>`;}).join('')+'</div>';
  const D=pick(DISC),C=pick(CONT);
  const a=pickWhile(()=>{const k=ri(3,6),n=ri(k+1,3*k);return n%k&&{k,n};}),b=pickWhile(()=>{const k=ri(3,6),n=ri(k+1,3*k);return n%k&&{k,n};});
  lg('rem',`X == ${a.n}//${a.k} and ${a.n}%${a.k} > 0`,Q(Math.floor(a.n/a.k)));lg('mix',`X == F(${b.n},${b.k})`,Q(b.n,b.k));
  const bul=(q,u)=>`<div class="subq">• האם זה אפשרי?<br>• <b>אם כן</b>, ${q} כל ילד? כתבו תרגיל שתוצאתו מספר מעורב.<br>• <b>אם לא</b>, הסבירו וכתבו תרגיל שבתוצאתו יש שארית.</div><div class="wl"></div><div class="wl"></div>`;
  h+=qh(9,`א. ${a.k} ילדים קנו במשותף ${D.o} ${a.n} ${D.u}. הם החליטו לחלק ביניהם את ${D.d} שווה בשווה.`)+bul(D.q)+
     `<div class="qh" style="margin-right:8mm">ב. ${b.k} ילדים קנו במשותף ${C.o} ${b.n} ${C.u}. הם החליטו לחלק ביניהם את ${C.d} שווה בשווה.</div>`+bul(C.q);
  key.push(`9א: לא — אי אפשר לחתוך ${D.w}. ${LT(a.n+' : '+a.k+' = '+Math.floor(a.n/a.k))} (שארית ${a.n%a.k})`,`9ב: כן — ${ex(b.n+' : '+b.k+' = '+qv(Q(b.n,b.k)))} ${C.u} לכל ילד`);
  return{t:'שברים — חלק א',h,key};}
function svgLineRaw(l){/* קצה הישר מוצג כשבר לא מצומצם, כמו בדף המקורי (12/5) */
  const s=svgLine(l.m,Q(1),true);return s.replace(/<text x="560"[^>]*>1<\/text><\/svg>$/,sF(560,64,l.m*l.s.n,l.s.d,14)+'</svg>');}

/* ---------- עמוד 5: קפיצות שוות על ישר 0–3 ---------- */
function pg5(){const key=[];const cards=[];
  const sent=(c,s,t)=>`<div class="sent">ב־${c} קפיצות של ${s} מגיעים ל־${t}.</div>`;
  {const D=pick([6,8,10,12]),a=pick(divs(D).filter(x=>x>=2&&x<D).concat([2,3]).filter(x=>x<D));const s=Q(a,D);
    cards.push([sent(BL('m'),gb(fr(a,D)),BL('m')),D,3]);lg('r38a',`X == F(${a},${D})*3`,mul(Q(a,D),Q(3)));
    key.push(`א: כל זוג נכון, לדוגמה: ב־3 קפיצות של ${fr(a,D)} מגיעים ל־${qk(3*a,D)}`);}
  {const D=pick([6,8,9,10,12]),t=pickWhile(()=>{const t=ri(4,D-1);return divs(t).length>2&&t;});const o=divs(t).filter(c=>c>1&&c<=t);
    cards.push([sent(BL('m'),gb(fr(BX,D)),gb(fr(t,D))),D,3]);lg('r38b',`X*${o[0]} == F(${t},${D})`,Q(t/o[0],D));
    key.push(`ב: ${o.map(c=>`${c} קפיצות של ${fr(t/c,D)}`).join(' · ')} (גם 1 קפיצה של ${fr(t,D)})`);}
  {let D2;const D=pick([6,8,10,12]);const t=pickWhile(()=>{const t=ri(4,D-1);return divs(t).length>2&&t;});const o=divs(t).filter(c=>c>1&&c<=t);
    cards.push([sent(BL('m'),BL('m'),gb(fr(t,D))),D,3]);lg('r38c',`X*${o[o.length-1]} == F(${t},${D})`,Q(t/o[o.length-1],D));
    key.push(`ג: ${o.map(c=>`${c} קפיצות של ${fr(t/c,D)}`).join(' · ')}`);}
  {const b=pick([3,4,5]),a=pickWhile(()=>{const a=ri(1,b-1);return gcd(a,b)===1&&a;});
    cards.push([sent(BL('m'),BL('m'),BX+gb(fr(a,b))),b,3]);lg('r38d',`X*${b+a} == 1+F(${a},${b})`,Q(1,b));
    key.push(`ד: פתוח. לדוגמה: ב־${b+a} קפיצות של ${fr(1,b)} מגיעים ל־${mx(1,a,b)}; או ב־${2*b+a} קפיצות של ${fr(1,b)} מגיעים ל־${mx(2,a,b)}`);}
  {const b=pick([3,4,5,7]),a=pickWhile(()=>{const a=ri(2,Math.min(3,b-1));return gcd(a,b)===1&&a;});const n=b+1,U=Math.max(3,Math.ceil(a+a/b));
    cards.push([sent(BL('m'),gb(fr(a,b)),BX+gb(fr(a,b))),b,U]);lg('r38e',`F(${a},${b})*X == ${a}+F(${a},${b})`,Q(n),[a,b]);
    key.push(`ה: ב־${n} קפיצות של ${fr(a,b)} מגיעים ל־${mx(a,a,b)}`);}
  const h=`<div style="font-weight:700;margin:1mm 0">בכל הסעיפים מתחילים מ־0 ומתקדמים בקפיצות שוות. השלימו.</div><div class="r38">`+
    cards.map((c,i)=>`<div class="card"><span class="tab">${LET[i]}</span>${c[0]}${svgRuler(c[1],c[2])}</div>`).join('')+'</div>';
  return{t:'כפל — שבר כפול מספר שלם · חזרה והעמקה',h,key};}

/* ---------- עמוד 6: חלקו / צמצמו / כפלו / הרחיבו ---------- */
function pg6(){const key=[];let prev='';const st=[];
  for(let r=0;r<2;r++){const C=pickWhile(()=>{const g=pick([2,2,3]),y=ri(2,7),x=ri(1,y-1),a=g*x,b=g*y;return gcd(x,y)===1&&a>=2&&b<=15&&(a+'/'+b)!==prev&&{a,b,g,x,y};});prev=C.a+'/'+C.b;st.push(C);}
  const h=st.map((C,r)=>{const k=C.g,dvd=Q(C.a/k,C.b),red=Q(C.x,C.y),dbl=Q(C.a*k,C.b),ext=Q(C.a*k,C.b*k);
    lg('star',`X == F(${C.a},${C.b})*F(1,${k})`,dvd,[C.a,C.b,k]);lg('star2',`X == F(${C.a},${C.b})`,red);
    key.push(`${r+1}א: חלקו ← ${fr(C.a/k,C.b)} · צמצמו ← ${fr(C.x,C.y)} · כפלו ← ${fr(C.a*k,C.b)} · הרחיבו ← ${fr(C.a*k,C.b*k)}`,
      `${r+1}ב: הגדול ${fr(C.a*k,C.b)} · ${r+1}ג: הקטן ${fr(C.a/k,C.b)} · ${r+1}ד: ${fr(C.x,C.y)} = ${fr(C.a*k,C.b*k)}`);
    return `<div class="card">${qh(r+1,'א. כתבו שברים לפי ההוראות.')}${svgStar(C.a,C.b,k)}<div class="subq">ב. איזה מהשברים שכתבתם בסעיף א הוא הגדול ביותר? ${BL('m')}</div><div class="subq">ג. איזה מהשברים שכתבתם בסעיף א הוא הקטן ביותר? ${BL('m')}</div><div class="subq">ד. שניים מהשברים שכתבתם בסעיף א שווים זה לזה. כתבו אותם: ${ex(BL('m')+' = '+BL('m'))}</div></div>`;}).join('');
  return{t:'חילוק — כשהמחלק או המנה הוא מספר שלם',h:`<div class="stars">${h}</div>`,key};}

/* ---------- עמוד 7: משוואות עם גורמים ומכפלה ---------- */
function pg7(){const key=[];const E=[];
  E.push(pickWhile(()=>{const b=ri(5,9),a=ri(1,b-1),n=ri(3,10);return gcd(a,b)===1&&(n*a)%b&&n*a>b&&{h:`${BL()} : ${gb(n)} = ${gb(fr(a,b))}`,x:Q(n*a,b),f:[n,fr(a,b)]};}));
  E.push(pickWhile(()=>{const n=ri(2,4),x=ri(1,3),b=ri(5,12),a=n*x;return a<b&&gcd(x,b)===1&&gcd(a,b)<a&&{h:`${BL()} × ${gb(n)} = ${gb(fr(a,b))}`,x:Q(x,b),prod:fr(a,b)};}));
  E.push(pickWhile(()=>{const b=ri(2,6),n=ri(b+1,12);return n%b&&{h:`${BL()} : ${gb(n)} = ${gb(fr(1,b))}`,x:Q(n,b),f:[n,fr(1,b)]};}));
  E.push(pickWhile(()=>{const b=pick([4,5,6,7,8,9]),c=ri(1,b-1),q=ri(3,6),t=q*c;return gcd(c,b)===1&&t>b&&t%b&&{h:`${gb(mx(Math.floor(t/b),t%b,b))} : ${BL()} = ${gb(fr(c,b))}`,x:Q(q),prod:mx(Math.floor(t/b),t%b,b)};}));
  E.push(pickWhile(()=>{const b=pick([4,5,6,7,8,9]),c=ri(1,b-1),q=ri(3,6),t=q*c;return gcd(c,b)===1&&t>b&&t%b&&{h:`${BL()} × ${gb(fr(c,b))} = ${gb(mx(Math.floor(t/b),t%b,b))}`,x:Q(q),prod:mx(Math.floor(t/b),t%b,b)};}));
  E.push(pickWhile(()=>{const b=pick([5,6,8,9,10,12]),c=ri(2,b-1),n=ri(2,4);return gcd(c,b)<c&&{h:`${BL()} : ${gb(fr(c,b))} = ${gb(n)}`,x:Q(n*c,b),raw:fr(n*c,b),f:[fr(c,b),n]};}));
  const h=`<div style="font-weight:700;margin:1mm 0 3mm">פתרו את המשוואות. אפשר להיעזר בתבניות.</div><div class="eqs">`+E.map((e,i)=>{
      key.push(`${LET[i]}: ${e.raw?e.raw+' = ':''}${qv(e.x)}`);
      return `<div class="card"><span class="tab">${LET[i]}</span>${ex(e.h,xs(e.x))}<div class="tpl"><div class="tr"><span class="tg">גורמים</span>${ex(BL('s')+' , '+BL('s'))}</div><div class="tr"><span class="tg">מכפלה</span>${BL('m')}</div></div></div>`;}).join('')+'</div>';
  return{t:'חילוק — כשהמחלק או המנה הוא מספר שלם',h,key};}

/* ---------- עמוד 8: ממוצע ---------- */
function avgS(vals){let s=Q(0);vals.forEach(v=>{s=add(s,v);});return dv(s,Q(vals.length));}
const card=(i,inner)=>`<div class="card"><span class="tab">${LET[i]}</span>${inner}</div>`;
function pg8(){const key=[];
  const A=pickWhile(()=>{const v=[];while(v.length<4){const x=ri(2,15);if(!v.includes(x))v.push(x);}return v.reduce((a,b)=>a+b)%4===0&&v;});
  const Bv=pickWhile(()=>{const b=pick([3,4,5]),x1=ri(1,b-1),x2=ri(1,2*b-1),x3=ri(1,2*b-1);return gcd(x1,b)===1&&x2!==x3&&gcd(x2,2*b)===1&&[[x1,b],[x2,2*b],[x3,2*b]];});
  const Cv=pickWhile(()=>{const v=[ri(70,99),ri(70,99),ri(70,99)];return new Set(v).size===3&&(v[0]+v[1]+v[2])%3===0&&v;});
  const Dv=pickWhile(()=>{const q=ri(1,2),r=pick([1,5]),s=pick([1,3,5]),W1=ri(1,3),W2=ri(1,2);return[[0,1,2],[W1,q,3],[0,r,6],[W2,s,6]];});
  const show=v=>Array.isArray(v)?(v.length===2?fr(v[0],v[1]):(v[0]?mx(v[0],v[1],v[2]):fr(v[1],v[2]))):''+v;
  const val=v=>Array.isArray(v)?(v.length===2?Q(v[0],v[1]):Q(v[0]*v[2]+v[1],v[2])):Q(v);
  const sets=[A,Bv,Cv,Dv];
  let h=qh(1,'מצאו את הממוצע של כל קבוצת מספרים.')+'<div class="avg">'+sets.map((S,i)=>{const m=avgS(S.map(val));
    lg('avg',`X == (${S.map(v=>py(val(v))).join('+')})/${S.length}`,m);key.push(`1${LET[i]}: ${qv(m)}`);
    return card(i,`<div class="nums">${S.map(v=>gb(show(v))).join('')}</div><div>הממוצע: ${BL('m')}</div>`);}).join('')+'</div>';
  const p1=pickWhile(()=>{const a=ri(3,12),b=ri(3,12);return a!==b&&[a,b];}),p2=pickWhile(()=>{const a=ri(3,12),b=ri(3,12);return a!==b&&[a,b];});
  const d3=pick([5,7,8,9]),p3=pickWhile(()=>{const a=ri(1,d3-1),b=ri(1,d3-1);return a!==b&&[[a,d3],[b,d3],ri(2,4)];});
  const d4=pick([5,7,8,9]),p4=pickWhile(()=>{const a=ri(1,d4-1),b=ri(1,d4-1);return a!==b&&[[a,d4],[b,d4],ri(2,4)];});
  const tasks=[[p1,true],[p2,false],[p3,true],[p4,false]];
  h+=qh(2,'הוסיפו מספר לכל קבוצה כך שהממוצע יהיה לפי המבוקש.')+'<div class="avg">'+tasks.map((t,i)=>{
    const vals=t[0].map(val),sum=vals.reduce((a,b)=>add(a,b),Q(0));let x;
    const N=vals.length+1;if(t[1]){const m=Math.floor(sum.n/sum.d/N)+1;x=sub(Q(N*m),sum);}else{x=Q(1);while(avgS(vals.concat([x])).d===1)x=Q(x.n+1);}
    lg('avg2',`(${vals.map(py).join('+')}+X)/${N} ${t[1]?'==':'!='} int((${vals.map(py).join('+')}+X)/${N}) and X>0`,x);
    key.push(`2${LET[i]}: פתוח. לדוגמה ${qv(x)} → ממוצע ${qv(avgS(vals.concat([x])))}`);
    return card(i,`<div>הממוצע הוא מספר ${t[1]?'שלם':'שאינו שלם'}:</div><div class="nums">${t[0].map(v=>gb(show(v))).join('')}<span class="ov"></span></div>`);}).join('')+'</div>'+
    '<div style="margin-top:3mm;font-weight:700">» חשבו את הממוצעים אחרי שהוספתם מספרים ובדקו את תשובותיכם.</div>';
  return{t:'חילוק — ממוצע',h,key};}

const PAGES=[pg1,pg2,pg3,pg4,pg5,pg6,pg7,pg8];
function build(seed){R=rng(seed);LOG=[];const pages=PAGES.map((f,i)=>{const p=f();p.i=i;return p;});return{pages,log:LOG};}
</script>
<script id="rs-ui">
/* ממשק: דף חדש, הדפסה, מספר סדרה בכתובת */
function pageHTML(p,seed){return `<section class="page pg${p.i+1}"><div class="ph"><span>שם: ________________</span><span>תאריך: ___________</span><span>עמוד ${p.i+1} מתוך 8</span></div><div class="pt">${p.t}</div>${p.h}<div class="pf"><span>דפי חזרה בשברים · כיתה ו׳</span><span>סדרה מס׳ ${seed}</span></div></section>`;}
function keyHTML(b,seed){return `<section class="page keypage"><div class="pt">דף תשובות להורה · סדרה מס׳ ${seed}</div>`+b.pages.map(p=>`<h3>עמוד ${p.i+1} — ${p.t}</h3><ul>${p.key.map(k=>`<li>${k}</li>`).join('')}</ul>`).join('')+'</section>';}
let SEED=0;
function rsRender(seed){SEED=seed;const b=build(seed);document.getElementById('pages').innerHTML=b.pages.map(p=>pageHTML(p,seed)).join('')+keyHTML(b,seed);
  document.getElementById('rsSeed').textContent=seed;try{history.replaceState(null,'','#s='+seed);}catch(e){}}
function rsNewSeed(){return 1+Math.floor(Math.random()*999999);}
function rsNew(){rsRender(rsNewSeed());window.scrollTo(0,0);}
function rsPrint(){rsRender(rsNewSeed());setTimeout(()=>window.print(),150);}
function rsFit(){const z=Math.min(1,(document.documentElement.clientWidth-16)/794);document.documentElement.style.setProperty('--z',z.toFixed(3));}
(function(){const m=/s=(\d+)/.exec(location.hash);const k=document.getElementById('rsKey');
  try{k.checked=localStorage.getItem('rs-key')==='1';}catch(e){}
  document.body.classList.toggle('withkey',k.checked);
  k.addEventListener('change',()=>{document.body.classList.toggle('withkey',k.checked);try{localStorage.setItem('rs-key',k.checked?'1':'0');}catch(e){}});
  rsFit();addEventListener('resize',rsFit);rsRender(m?+m[1]:rsNewSeed());})();
</script>
