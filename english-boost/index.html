<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D4ED8">
<title>English Boost | חיזוק דקדוק באנגלית</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Boost">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#FAF6EB;--card:#FFFFFF;--ink:#1E4634;--ink-soft:#4F6B5D;--muted:#7A8B7F;--line:#D8E4D4;
  --c:#1D4ED8;--c-soft:#E6EDFF;--ok:#15803D;--ok-soft:#E5F6EA;--warn:#B45309;--warn-soft:#FFF4E0;--bad:#B91C1C;--bad-soft:#FDECEC;
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,system-ui,sans-serif;font-size:17px;line-height:1.5}
button,input{font:inherit}
.en{direction:ltr;unicode-bidi:isolate;text-align:left;display:block}
span.en{display:inline}
main{max-width:720px;margin:0 auto;padding:0 16px 110px}
.tabs{position:fixed;inset:auto 0 0 0;z-index:40;display:flex;gap:6px;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:#FFFDF7;border-top:1px solid var(--line);box-shadow:0 -2px 10px rgba(30,70,50,.06)}
.tabs button{flex:1;max-width:180px;min-height:52px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-weight:800;cursor:pointer;
  font-size:14px;line-height:1.15;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
.tabs button .ti{font-size:19px}
.tabs button[aria-current="page"]{background:var(--c);border-color:var(--c);color:#fff}
.tabs button .badge{position:absolute;top:3px;inset-inline-start:6px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:#F59E0B;color:#fff;font-size:12px;line-height:20px}
.tabs.hide{display:none}
h2{font-size:20px;margin:18px 0 10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 12px;
  box-shadow:0 4px 0 color-mix(in srgb,var(--c) 18%,var(--line))}
.task{display:flex;gap:12px;align-items:center;width:100%;text-align:right;cursor:pointer;color:inherit}
.task .ic{font-size:30px;flex:0 0 auto}
.task b{display:block;font-size:18px}
.task small{display:block;color:var(--ink-soft);font-size:15px}
.task .ar{margin-inline-start:auto;font-size:22px;color:var(--c)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:10px 18px;border-radius:14px;border:2px solid var(--c);
  background:var(--c);color:#fff;font-weight:800;cursor:pointer;width:100%}
.btn.sec{background:#fff;color:var(--c)}
.btn.quiet{background:#fff;color:var(--ink-soft);border-color:var(--line)}
.btn.danger{background:#fff;color:var(--bad);border-color:#F3C4C4}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.tabs button:focus-visible,.task:focus-visible,.opt:focus-visible,.say:focus-visible{outline:3px solid #F59E0B;outline-offset:2px}
.row{display:flex;gap:10px;margin-top:10px}
.row>*{flex:1}
.muted{color:var(--ink-soft)}
.small{font-size:14px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--c-soft);color:var(--c);font-weight:700;font-size:14px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.open{background:var(--warn-soft);color:var(--warn)}
.rule p{margin:0 0 8px}
.examples{background:var(--c-soft);border-radius:12px;padding:10px 14px;margin:10px 0 14px}
.examples .sl{margin:4px 0;font-weight:600}
.sl{display:flex;align-items:center;gap:8px;direction:ltr}
.sl .en{flex:1;min-width:0}
.say{flex:0 0 auto;width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center;padding:0}
.say:active{transform:scale(.94)}
.progressbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 14px}
.progressbar i{display:block;height:100%;background:var(--c);transition:width .3s}
.prompt{font-size:19px;font-weight:700;margin:0 0 6px}
.prompt-en{font-size:19px;font-weight:600;margin:0 0 12px;color:var(--c)}
.opt{display:block;width:100%;min-height:52px;margin:0 0 10px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;
  color:var(--ink);font-weight:700;cursor:pointer;direction:ltr;text-align:left}
.opt.picked{border-color:var(--c);background:var(--c-soft)}
.opt:disabled{cursor:default}
textarea{width:100%;min-height:76px;padding:12px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);
  direction:ltr;text-align:left;font-family:inherit;font-size:18px;resize:vertical}
textarea:focus{outline:none;border-color:var(--c)}
textarea:disabled{background:#F4F4F0}
.fb{border-radius:14px;padding:12px 14px;margin:12px 0}
.fb.ok{background:var(--ok-soft)}
.fb.warn{background:var(--warn-soft)}
.fb.info{background:var(--c-soft)}
.fb h3{margin:0 0 6px;font-size:18px}
.fb.ok h3{color:var(--ok)}
.fb.warn h3{color:var(--warn)}
.model{background:#fff;border-radius:10px;padding:8px 12px;margin:8px 0}
.model .t{font-size:14px;color:var(--ink-soft)}
.model .main .en{font-weight:700}
.vocab-save{margin-top:8px}
.top{display:flex;align-items:center;gap:10px;margin:14px 0 6px}
.top h1{font-size:21px;margin:0;flex:1}
.x{min-height:44px;min-width:44px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv .v{color:var(--ink-soft);text-align:left}
.vitem{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.vitem:last-child{border-bottom:0}
.vitem .body{flex:1;min-width:0}
.vitem .del{min-height:40px;min-width:40px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}
.mist{padding:12px 0;border-bottom:1px solid var(--line)}
.mist:last-child{border-bottom:0}
.mist .head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:6px}
.mist .yours{background:var(--bad-soft);border-radius:10px;padding:6px 10px;margin:4px 0;text-decoration:line-through;text-decoration-color:rgba(185,28,28,.5)}
.mist .right{background:var(--ok-soft);border-radius:10px;padding:6px 10px;margin:4px 0;font-weight:700}
.devnote{color:var(--warn);font-size:14px;font-weight:700}
.err{color:var(--bad);font-weight:700;white-space:pre-wrap}
.big{font-size:24px;font-weight:800;margin:6px 0 14px}
.install{border-style:dashed}
@media (prefers-reduced-motion:reduce){.progressbar i{transition:none}.say:active{transform:none}}
</style>
<link id="kit-theme" rel="stylesheet" href="../shared/kit-theme.css">
<style id="kit-match-css">
/* KIT-MATCH — english-boost: כותרת בסגנון דף הבית (17/11/2026). להסרה: למחוק את הבלוק, את link#kit-theme ואת div.kit-hero */
body{--c:#1D4ED8}
.kit-hero{margin-bottom:6px!important}
</style>
<style id="eb-bidi-css">
/* ביטוי באנגלית בתוך כותרת בעברית לא נשבר באמצע שורה (Present / perfect) */
h1 bdi,h2 bdi,.task b bdi,.kv b bdi,.kv>span bdi,.mist b bdi{white-space:nowrap}
</style>
<style id="eb-notebook-css">
/* EB-NOTEBOOK — שפת העיצוב "מחברת עם עט אדום" (שלב 1, 18/11/2026).
   צבע = מצב: אדום (טעות פתוחה) → כתום (בתהליך) → ירוק (הוכח) → כחול-דיו (שולט). אנגלית בגופן סריף של המערכת.
   להסרה: למחוק את הבלוק הזה. הסימון (bidi, diff) ממשיך לעבוד גם בלעדיו. */
:root{
  --st-open:#B42318;--st-open-bg:#FDECEA;--st-work:#A15C07;--st-work-bg:#FEF3DC;
  --st-proof:#17703A;--st-proof-bg:#E4F4E8;--st-ink:#1E3A8A;--st-ink-bg:#E7EDFB;--st-new:#5E6B63;--st-new-bg:#EEF1EC;
  --margin-line:rgba(180,35,24,.35);--paper:#FFFFFF;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
}
.prompt-en,.examples .en,.model .en,.mist .en,.opt,textarea,.diff,.vitem .en,.fb .sl .en{font-family:var(--serif)}
.prompt-en{font-size:21px;font-weight:600}
.opt{font-size:19px;font-weight:600}
textarea{font-size:19px}
/* עמוד היום: כותרת תאריך וקו שוליים אדום כמו במחברת */
.page-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:18px 0 10px}
.page-head h2{margin:0}
.page-head .date{color:var(--ink-soft);font-size:15px}
.task{border-inline-start:6px solid var(--st-new)}
.task.k0{border-inline-start-color:var(--st-open)}
.task.k1{border-inline-start-color:var(--st-work)}
.task.k2{border-inline-start-color:var(--st-new)}
.task.kx{border-inline-start-color:var(--st-ink)}
/* תוויות מצב */
.pill.st-new{background:var(--st-new-bg);color:var(--st-new)}
.pill.st-learning{background:var(--st-work-bg);color:var(--st-work)}
.pill.st-practicing{background:var(--st-proof-bg);color:var(--st-proof)}
.pill.st-mastered{background:var(--st-ink-bg);color:var(--st-ink)}
.pill.open{background:var(--st-open-bg);color:var(--st-open)}
.pill.ok{background:var(--st-proof-bg);color:var(--st-proof)}
.kv .pill{font-size:13px;padding:1px 9px;font-weight:700;vertical-align:1px}
/* עט אדום: מה למחוק ומה להוסיף */
.diff{direction:ltr;text-align:left;font-size:19px;line-height:1.9;background:var(--paper);border-radius:10px;padding:8px 12px;margin:8px 0;
  border-inline-end:3px solid var(--margin-line)}
.diff .del{color:var(--st-open);text-decoration:line-through;text-decoration-thickness:2px}
.diff .ins{color:var(--st-proof);font-weight:700;border-bottom:2px solid currentColor}
.diff .hint{color:var(--st-open);text-decoration:underline wavy;text-decoration-thickness:1.5px;text-underline-offset:4px}
.diff .gap{color:var(--st-open);font-weight:800;padding:0 1px}
.diff.soft .del{color:var(--st-work);text-decoration:none;border-bottom:2px dotted currentColor}
.diff.soft .ins{color:var(--st-ink);border-bottom-style:dotted}
.diff-t{font-size:14px;color:var(--ink-soft);margin:8px 0 0}
.vocab-save{flex-wrap:wrap;column-gap:6px;row-gap:0}
/* מצב כהה */
@media (prefers-color-scheme:dark){
  :root{--bg:#141A17;--card:#1C2420;--ink:#E7EFE9;--ink-soft:#A9B8AE;--muted:#8E9C93;--line:#33413A;
    --c:#7EA2FF;--c-soft:#1F2B47;--ok:#6FD394;--ok-soft:#173325;--warn:#F2B35B;--warn-soft:#3A2C14;--bad:#F28B82;--bad-soft:#3B1D1B;
    --st-open:#F28B82;--st-open-bg:#3B1D1B;--st-work:#F2B35B;--st-work-bg:#3A2C14;--st-proof:#6FD394;--st-proof-bg:#173325;
    --st-ink:#9DB7FF;--st-ink-bg:#1F2B47;--st-new:#A9B8AE;--st-new-bg:#26302B;--margin-line:rgba(242,139,130,.4);--paper:#151C18}
  html body{background:var(--bg)!important;color:var(--ink)}
  .card,html .kit-themed .card{background:var(--card)!important;border-color:var(--line)!important;box-shadow:none!important}
  .tabs{background:#18201C;box-shadow:none}
  .tabs button,.btn.sec,.btn.quiet,.btn.danger,.opt,textarea,.say,.x,.model,.vitem .del{background:var(--card);color:var(--ink)}
  .btn.sec{color:var(--c)}
  .btn:not(.sec):not(.quiet):not(.danger){background:#2F5BD8;border-color:#2F5BD8;color:#fff}
  .tabs button[aria-current="page"]{background:#2F5BD8;border-color:#2F5BD8;color:#fff}
  textarea:disabled{background:#202925}
  .kit-hero{box-shadow:none!important}
}
</style>
</head>
<body class="kit-themed">
<div class="kit-hero" role="banner" style="--c:#1D4ED8"><span class="kh-pal" aria-hidden="true">🗽</span><div class="kh-t"><div class="kh-title">English Boost</div><div class="kh-sub">חיזוק דקדוק באנגלית · 10 דקות ביום</div></div><a class="kh-home" href="../" aria-label="מרכזי הלמידה">🏠</a></div>
<main id="app" aria-live="polite"><p class="muted">טוען…</p></main>
<nav class="tabs" id="tabs" aria-label="מסכים">
  <button type="button" data-tab="today"><span class="ti" aria-hidden="true">📅</span>היום</button>
  <button type="button" data-tab="mistakes"><span class="ti" aria-hidden="true">📝</span>טעויות</button>
  <button type="button" data-tab="progress"><span class="ti" aria-hidden="true">📈</span>התקדמות</button>
  <button type="button" data-tab="vocab"><span class="ti" aria-hidden="true">📒</span>מילים</button>
</nav>
<script src="platform.js"></script>
<script src="engine.js"></script>
<script>
/* English Boost — הממשק (17–18/11/2026). המנוע והכללים ב-engine.js, כל מה שתלוי במכשיר ב-platform.js.
   הנתונים נשמרים במפתח אחד (eb.data) דרך Platform.storage, ו-shared/cloud.js מגבה אותו לענן כמו בשאר האתר. */
(function () {
  'use strict';
  var TOPIC_FILES = [
    'topic-present-simple-continuous.json',
    'topic-present-perfect.json',
    'topic-articles.json',
    'topic-past-vs-present-perfect.json',
    'topic-future.json',
    'topic-time-conditional-clauses.json',
    'topic-questions.json',
    'topic-subject-verb.json',
    'topic-countable-uncountable.json',
    'topic-prepositions.json'
  ];
  var KEY = 'eb.data', OFFSET_KEY = 'eb.dayOffset', SAFE_KEY = 'eb.data.before';
  var DEV = /[?&]dev\b/.test(location.search);
  var P = window.Platform;
  var app = document.getElementById('app'), tabsEl = document.getElementById('tabs');
  var topics = [], loadError = null, EX = {};
  /* readOnly, dataNote ו-backupMsg מוגדרים לפני load(), שמשנה אותם בזמן הטעינה */
  var dataNote = null, saveFailed = false, readOnly = false, backupMsg = null;
  var S = load();
  var view = { tab: 'today' };
  var L = null; // שיעור או חזרה פעילים
  var R = null; // חזרה על אוצר מילים

  // ---------- שמירה ----------
  function emptyData() { return EB.emptyData(); }
  /* טעינה דרך EB.migrateData: נתונים מגרסה ישנה מתעדכנים; נתונים מגרסה חדשה יותר (מכשיר אחר) או פגומים
     לא נמחקים: עובדים במצב קריאה בלבד ומבקשים לרענן, כדי שהשמירה הבאה לא תדרוס אותם. */
  function load() {
    var raw = P.storage.get(KEY), m = EB.migrateData(raw);
    if (m.status === 'ok' || m.status === 'empty') return m.data;
    if (m.status === 'migrated') { P.storage.set(SAFE_KEY, raw); P.storage.set(KEY, m.data); return m.data; }
    readOnly = true;
    dataNote = m.status === 'newer'
      ? 'ההתקדמות שלך נשמרה בגרסה חדשה יותר של הערכה. רענן את הדף כדי לקבל אותה. עד אז שום דבר לא נשמר.'
      : 'הנתונים השמורים במכשיר לא נקראו. הם לא נמחקו. אפשר לשחזר מגיבוי במסך ההתקדמות.';
    return emptyData();
  }
  function save() {
    if (readOnly) return;
    if (!P.storage.set(KEY, S) && !saveFailed) { saveFailed = true; dataNote = 'השמירה במכשיר נכשלה (אולי חסר מקום). כדאי לשמור גיבוי במסך ההתקדמות.'; }
  }
  function dayOffset() { return parseInt(P.storage.get(OFFSET_KEY), 10) || 0; }
  function setOffset(n) { if (n) P.storage.set(OFFSET_KEY, n); else P.storage.remove(OFFSET_KEY); }
  function now() { return EB.addDays(dayOffset(), Date.now()) + (Date.now() - EB.startOfDay(Date.now())); }
  function topicById(id) { return topics.find(function (t) { return t.id === id; }); }
  function tagName(topicId, tag) { var t = topicById(topicId); return (t && t.tags[tag]) || tag; }

  // ---------- עזר לתצוגה ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  // עברית עם אנגלית באמצע: כל רצף לטיני עטוף ב-bdi, כדי שהפיסוק לא יתהפך ("?Where do you work").
  var LATIN_RUN = /[A-Za-z][A-Za-z0-9\s':,.?!\/\u2019\u2026-]*[A-Za-z0-9?!]|[A-Za-z]/g;
  function bidi(s) {
    s = String(s == null ? '' : s);
    var out = '', last = 0;
    try {
      s.replace(LATIN_RUN, function (m, off) { out += esc(s.slice(last, off)) + '<bdi dir="ltr">' + esc(m) + '</bdi>'; last = off + m.length; return m; });
      return out + esc(s.slice(last));
    } catch (e) { return esc(s); }
  }
  function en(s, tag) { tag = tag || 'div'; return '<' + tag + ' class="en" dir="ltr" lang="en">' + esc(s) + '</' + tag + '>'; }
  function sayBtn(s) { return P.speech.available ? '<button type="button" class="say" data-say="' + esc(s) + '" aria-label="השמעה">🔊</button>' : ''; }
  /* שורת אנגלית עם כפתור השמעה */
  function enS(s, cls) { return '<div class="sl' + (cls ? ' ' + cls : '') + '">' + en(s) + sayBtn(s) + '</div>'; }
  /* עט אדום: full = מה למחוק ומה להוסיף; hint = רק איפה הבעיה (בלי לגלות את התשובה); soft = הבדלים מניסוח לדוגמה */
  function diffHtml(answer, ex, mode) {
    try {
      var d = EB.wordDiff(answer, [ex.modelAnswer].concat(ex.alternatives || []), function (x) { return EB.check(x, ex).kind === 'correct'; });
      if (!d.ops.length || !d.changes) return '';
      var parts = d.ops.map(function (o) {
        if (o.op === 'same') return esc(o.text);
        if (mode === 'hint') return o.op === 'del' ? '<span class="hint">' + esc(o.text) + '</span>' : '<span class="gap" aria-label="חסרה כאן מילה">‸</span>';
        return '<span class="' + o.op + '">' + esc(o.text) + '</span>';
      });
      return '<div class="diff' + (mode === 'soft' ? ' soft' : '') + '" dir="ltr" lang="en">' + parts.join(' ') + '</div>';
    } catch (e) { return ''; }
  }
  function statePill(st) { return '<span class="pill st-' + esc(st) + '">' + EB.STATE_HE[st] + '</span>'; }
  function pct(x) { return Math.round(x * 100) + '%'; }
  function daysText(d) { return d <= 0 ? 'היום' : d === 1 ? 'מחר' : 'בעוד ' + d + ' ימים'; }
  function render(html) { app.innerHTML = html; }
  function openMistakes() { return EB.mistakeLog(S.attempts).filter(function (m) { return !m.resolved && EX[m.attempt.ex]; }); }
  function setTabs() {
    tabsEl.classList.toggle('hide', !!(L || R));
    var open = openMistakes().length;
    Array.prototype.forEach.call(tabsEl.querySelectorAll('button'), function (b) {
      if (b.dataset.tab === view.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
      if (b.dataset.tab === 'mistakes') {
        var bd = b.querySelector('.badge');
        if (open && !bd) { bd = document.createElement('span'); bd.className = 'badge'; b.appendChild(bd); }
        if (bd) { if (open) { bd.textContent = open > 99 ? '99+' : String(open); bd.setAttribute('aria-label', open + ' טעויות פתוחות'); } else bd.remove(); }
      }
    });
  }
  function draw() {
    setTabs();
    if (L) return drawLesson();
    if (R) return drawReview();
    if (view.tab === 'progress') return drawProgress();
    if (view.tab === 'vocab') return drawVocab();
    if (view.tab === 'mistakes') return drawMistakes();
    drawToday();
  }
  // השמעה: כפתור 🔊 בכל מקום בדף
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-say]'); if (!b) return;
    e.preventDefault(); P.speech.speak(b.dataset.say);
  });

  // ---------- היום ----------
  var KIND_IC = ['🔁', '🗓️', '✨'];
  function installCard() {
    if (P.install.isStandalone()) return '';
    if (P.install.canPrompt()) {
      return '<div class="card install"><b>📲 להתקין כאפליקציה</b><p class="small muted" style="margin:4px 0 0">נפתח ממסך הבית, במסך מלא, וגם בלי אינטרנט.</p>'
        + '<div class="row"><button type="button" class="btn sec" id="installBtn">התקנה</button></div></div>';
    }
    if (P.install.isIOS) {
      return '<div class="card install"><b>📲 להוסיף למסך הבית</b><p class="small muted" style="margin:4px 0 0">ב-Safari: לוחצים על <b>שיתוף</b> ⬆️ ואז <b>הוספה למסך הבית</b>. '
        + 'כך נפתח כמו אפליקציה, וההתקדמות לא נמחקת אחרי שבוע בלי כניסה.</p></div>';
    }
    return '';
  }
  function drawToday() {
    var t = now();
    var plan = EB.todayPlan(topics, S.progress, S.attempts, t);
    var due = S.vocab.filter(function (v) { return v.nextDue <= t; });
    var mixed = S.mixedDay === EB.dayKey(t) ? [] : EB.mixedReview(topics, S.progress, S.attempts, t);
    var open = openMistakes();
    var h = '';
    if (loadError) h += '<div class="card err">' + esc(loadError) + '</div>';
    if (dataNote) h += '<div class="card err" role="alert">' + esc(dataNote) + '</div>';
    var dateHe = ''; try { dateHe = new Date(t).toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long' }); } catch (e) {}
    h += '<div class="page-head"><h2>מה לתרגל היום</h2><span class="date">' + esc(dateHe) + '</span></div>';
    if (!plan.length && !loadError) h += '<div class="card muted">אין משימות להיום. הנושאים יחזרו לפי לוח החזרות.</div>';
    plan.forEach(function (it, i) {
      h += '<button type="button" class="card task k' + it.kind + '" data-start="' + i + '"><span class="ic" aria-hidden="true">' + KIND_IC[it.kind] + '</span>'
        + '<span><b>' + bidi(it.topic.titleHe) + '</b><small>' + esc(it.reasonHe) + '</small></span><span class="ar" aria-hidden="true">←</span></button>';
    });
    if (mixed.length || due.length || open.length) h += '<h2>עוד היום</h2>';
    if (mixed.length) {
      h += '<button type="button" class="card task kx" data-mixed="1"><span class="ic" aria-hidden="true">🔀</span>'
        + '<span><b>חזרה מעורבת</b><small>' + mixed.length + ' תרגילים מכמה נושאים, בלי לדעת מראש איזה כלל. ככה בונים שליטה אמיתית.</small></span><span class="ar" aria-hidden="true">←</span></button>';
    }
    if (open.length) {
      h += '<button type="button" class="card task k0" data-mist="1"><span class="ic" aria-hidden="true">📝</span>'
        + '<span><b>' + open.length + ' טעויות פתוחות</b><small>תרגול של המשפטים שבהם טעית, עד שהם יוצאים נכון.</small></span><span class="ar" aria-hidden="true">←</span></button>';
    }
    if (due.length) {
      h += '<button type="button" class="card task k1" data-review="1"><span class="ic" aria-hidden="true">📒</span>'
        + '<span><b>' + due.length + ' ביטויים מחכים לחזרה</b><small>רואים בעברית, כותבים באנגלית</small></span><span class="ar" aria-hidden="true">←</span></button>';
    }
    h += '<h2>כל הנושאים</h2><div class="card">';
    topics.forEach(function (tp) {
      var p = S.progress[tp.id];
      h += '<div class="kv"><span>' + bidi(tp.titleHe) + ' ' + statePill(p ? p.state : 'new') + '</span>'
        + '<button type="button" class="btn sec" style="width:auto;min-height:40px;padding:4px 14px" data-free="' + esc(tp.id) + '">תרגול</button></div>';
    });
    h += '</div>' + installCard();
    if (dayOffset()) h += '<p class="devnote">מצב פיתוח: התאריך מוזז ב-' + dayOffset() + ' ימים</p>';
    render(h);
    app.querySelectorAll('[data-start]').forEach(function (b) {
      b.onclick = function () { var it = plan[+b.dataset.start]; startLesson(it.topic, it.focusTag); };
    });
    app.querySelectorAll('[data-free]').forEach(function (b) { b.onclick = function () { startLesson(topicById(b.dataset.free), null); }; });
    var rv = app.querySelector('[data-review]'); if (rv) rv.onclick = startReview;
    var mx = app.querySelector('[data-mixed]'); if (mx) mx.onclick = function () { startMixed(mixed, 'mixed'); };
    var ms = app.querySelector('[data-mist]'); if (ms) ms.onclick = startMistakePractice;
    var ib = document.getElementById('installBtn'); if (ib) ib.onclick = function () { P.install.prompt().then(draw); };
  }

  // ---------- שיעור ----------
  function startLesson(topic, focusTag) {
    if (!topic) return;
    var exs = EB.sessionExercises(topic, S.attempts, focusTag);
    L = newLesson('topic', exs.map(function (e) { return { ex: e, topicId: topic.id }; }));
    L.topic = topic; L.focusTag = focusTag; L.phase = 'rule';
    draw(); window.scrollTo(0, 0);
  }
  /* חזרה מעורבת או תרגול טעויות: תרגילים מכמה נושאים, בלי מסך כלל ובלי לשנות את לוח החזרות של הנושאים. */
  function startMixed(items, kind) {
    if (!items.length) return;
    L = newLesson(kind, items);
    L.phase = 'answering';
    draw(); window.scrollTo(0, 0); focusAns();
  }
  function startMistakePractice() {
    var items = openMistakes().slice(0, 6).map(function (m) { return { ex: EX[m.attempt.ex].ex, topicId: EX[m.attempt.ex].topicId }; });
    startMixed(items, 'mistakes');
  }
  function newLesson(kind, items) {
    var seen = {};
    S.attempts.forEach(function (a) { seen[a.ex] = 1; });
    return { kind: kind, items: items, topic: null, focusTag: null, seen: seen,
      i: 0, answer: '', tries: 0, phase: 'answering', fb: null, attempt: null, results: [], summary: null };
  }
  function cur() { return L.items[L.i]; }
  function lessonTitle() { return L.kind === 'mixed' ? 'חזרה מעורבת' : L.kind === 'mistakes' ? 'תרגול טעויות' : L.topic.titleHe; }
  function exitLesson() { L = null; draw(); window.scrollTo(0, 0); }
  function canAnswer() { return L.phase === 'answering' || (L.phase === 'error' && L.tries < 2); }

  function drawLesson() {
    var h = '<div class="top"><h1>' + bidi(lessonTitle()) + '</h1><button type="button" class="x" id="exit" aria-label="יציאה">✕</button></div>';
    if (L.phase === 'rule') {
      var t = L.topic;
      if (L.focusTag) h += '<p><span class="pill">היום מתמקדים ב: ' + esc(t.tags[L.focusTag] || L.focusTag) + '</span></p>';
      h += '<div class="card rule"><h2 style="margin-top:0">הכלל</h2>' + t.ruleHe.map(function (l) { return '<p>' + bidi(l) + '</p>'; }).join('')
        + '<h2>דוגמאות</h2><div class="examples">' + t.examples.map(function (x) { return enS(x); }).join('') + '</div>'
        + '<button type="button" class="btn" id="go">מתחילים תרגול (' + L.items.length + ' תרגילים)</button></div>';
    } else if (L.phase === 'summary') {
      var s = L.summary;
      h += '<div class="card"><h2 style="margin-top:0">סיכום</h2>';
      if (s && s.total) {
        h += '<p class="big">' + s.correct + ' מתוך ' + s.total + ' נכון בניסיון הראשון</p>';
        if (s.state) {
          h += '<div class="kv"><span>מצב הנושא</span><span class="v">' + statePill(s.state) + '</span></div>'
            + '<div class="kv"><span>חזרה הבאה</span><span class="v">' + daysText(EB.daysBetween(now(), s.nextDue)) + '</span></div>';
          if (s.repeatedTag) h += '<div class="fb warn">שים לב: ' + esc(L.topic.tags[s.repeatedTag] || s.repeatedTag) + ' חזרה כמה פעמים. נחזור אליה מחר במשפטים חדשים.</div>';
        } else {
          (s.byTopic || []).forEach(function (x) { h += '<div class="kv"><span>' + bidi(x.title) + '</span><span class="v">' + x.correct + ' מתוך ' + x.total + '</span></div>'; });
          var left = openMistakes().length;
          h += '<p class="small muted">' + (left ? 'נשארו ' + left + ' טעויות פתוחות במחברת.' : 'אין טעויות פתוחות במחברת 🎉') + '</p>';
        }
      } else h += '<p>אין כרגע תרגילים כאן.</p>';
      h += '<div class="row"><button type="button" class="btn" id="done">חזרה</button></div></div>';
    } else {
      var it = cur(), ex = it.ex;
      h += '<div class="muted small">תרגיל ' + (L.i + 1) + ' מתוך ' + L.items.length + '</div>'
        + '<div class="progressbar" aria-hidden="true"><i style="width:' + Math.round(100 * L.i / L.items.length) + '%"></i></div>'
        + '<div class="card"><p class="prompt">' + esc(ex.promptHe) + '</p>' + (ex.promptEn ? '<p class="prompt-en en" dir="ltr" lang="en">' + esc(ex.promptEn) + '</p>' : '');
      if (ex.type === 'choose') {
        (ex.options || []).forEach(function (o, k) {
          h += '<button type="button" class="opt' + (L.answer === o && L.phase !== 'answering' ? ' picked' : '') + '" data-opt="' + k + '" lang="en"' + (canAnswer() ? '' : ' disabled') + '>' + esc(o) + '</button>';
        });
      } else {
        h += '<label class="small muted" for="ans">התשובה שלך באנגלית</label>'
          + '<textarea id="ans" dir="ltr" lang="en" rows="2" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" placeholder="Write your answer in English"'
          + (canAnswer() ? '' : ' disabled') + '>' + esc(L.answer) + '</textarea>';
        if (canAnswer()) h += '<div class="row"><button type="button" class="btn" id="check">בדיקה</button></div>';
      }
      h += feedback(it) + '</div>';
    }
    render(h);
    document.getElementById('exit').onclick = function () {
      if (L.phase === 'rule' || L.phase === 'summary' || confirm('לצאת? התשובות שכבר נתת נשמרות.')) {
        if (L.results.length && L.phase !== 'summary') finishLesson(true); else exitLesson();
      }
    };
    var go = document.getElementById('go'); if (go) go.onclick = function () { L.phase = L.items.length ? 'answering' : 'summary'; draw(); focusAns(); };
    var done = document.getElementById('done'); if (done) done.onclick = exitLesson;
    app.querySelectorAll('[data-opt]').forEach(function (b) {
      b.onclick = function () { L.answer = cur().ex.options[+b.dataset.opt]; doCheck(); };
    });
    var ta = document.getElementById('ans');
    if (ta) {
      var chk = document.getElementById('check');
      var sync = function () { L.answer = ta.value; if (chk) chk.disabled = !ta.value.trim(); };
      ta.oninput = sync; sync();
      ta.onkeydown = function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (ta.value.trim() && canAnswer()) doCheck(); } };
      if (chk) chk.onclick = doCheck;
    }
    var nx = document.getElementById('next'); if (nx) nx.onclick = nextEx;
    var yes = document.getElementById('selfYes'); if (yes) yes.onclick = function () { selfAssess(true); };
    var no = document.getElementById('selfNo'); if (no) no.onclick = function () { selfAssess(false); };
    app.querySelectorAll('[data-vocab]').forEach(function (b) { b.onclick = function () { saveVocab(+b.dataset.vocab); }; });
  }
  function focusAns() { var ta = document.getElementById('ans'); if (ta && !ta.disabled) try { ta.focus({ preventScroll: true }); } catch (e) {} }

  function modelBlock(ex, title) {
    return '<div class="model"><div class="t">' + esc(title) + '</div><div class="main">' + enS(ex.modelAnswer) + '</div>'
      + (ex.alternatives || []).map(function (a) { return '<div class="small">או: ' + en(a, 'span') + '</div>'; }).join('') + '</div>';
  }
  function vocabButtons(ex) {
    return (ex.vocab || []).map(function (v, k) {
      var saved = S.vocab.some(function (x) { return x.en.toLowerCase() === v.en.toLowerCase(); });
      return '<button type="button" class="btn quiet vocab-save" data-vocab="' + k + '"' + (saved ? ' disabled' : '') + '>'
        + '<span>' + (saved ? '✓ נשמר:' : '➕ שמירת ביטוי:') + '</span> ' + en(v.en, 'span') + (saved ? '' : ' <span class="muted">(' + esc(v.he) + ')</span>') + '</button>';
    }).join('');
  }
  function topicNote(it) { return L.kind === 'topic' ? '' : '<p class="small muted" style="margin:6px 0 0">הנושא: ' + bidi((topicById(it.topicId) || {}).titleHe || '') + '</p>'; }
  function nextBtn() { return '<div class="row"><button type="button" class="btn" id="next">' + (L.i + 1 < L.items.length ? 'הבא ←' : 'סיום') + '</button></div>'; }
  function feedback(it) {
    var ex = it.ex, f = L.fb;
    switch (L.phase) {
      case 'correct':
        return '<div class="fb ok"><h3>' + (L.tries === 1 ? '✓ נכון!' : '✓ נכון, תוקן!') + '</h3>' + modelBlock(ex, 'ניסוח תקין') + vocabButtons(ex) + topicNote(it) + '</div>' + nextBtn();
      case 'error':
        var prod = ex.type !== 'choose';
        return '<div class="fb warn"><h3>לא בדיוק</h3>'
          + (prod && L.tries < 2 ? '<p class="diff-t">איפה הבעיה:</p>' + diffHtml(L.answer, ex, 'hint') : '')
          + (prod && L.tries >= 2 ? '<p class="diff-t">התיקון:</p>' + diffHtml(L.answer, ex, 'full') : '')
          + '<p style="margin:0">' + bidi(f.explainHe) + '</p>'
          + (f.isRepeat ? '<p class="small muted">זו טעות שחוזרת. הנושא יחזור מחר בתרגילים אחרים.</p>' : '')
          + (L.tries < 2 ? '<p class="small muted">' + (ex.type === 'choose' ? 'נסה לבחור תשובה אחרת.' : 'תקן את התשובה ולחץ "בדיקה".') + '</p></div>'
            : modelBlock(ex, 'התשובה הנכונה') + vocabButtons(ex) + topicNote(it) + '</div>' + nextBtn());
      case 'unknown':
        return '<div class="fb info"><h3>לא זיהיתי את התשובה אוטומטית</h3><p style="margin:0">השווה לניסוח הזה. ייתכן שגם הניסוח שלך נכון.</p>' + modelBlock(ex, 'ניסוח לדוגמה')
          + (ex.type !== 'choose' ? '<p class="diff-t">ההבדלים מהניסוח לדוגמה:</p>' + diffHtml(L.answer, ex, 'soft') : '')
          + '<p style="margin:8px 0 0">התשובה שלך נכונה?</p><div class="row"><button type="button" class="btn" id="selfYes">כן, נכונה</button>'
          + '<button type="button" class="btn sec" id="selfNo">לא, טעיתי</button></div></div>';
      case 'revealed':
        return '<div class="fb info">' + modelBlock(ex, 'ניסוח תקין') + vocabButtons(ex) + topicNote(it) + '</div>' + nextBtn();
    }
    return '';
  }

  function doCheck() {
    var it = cur(), ex = it.ex;
    if (!canAnswer() || !String(L.answer).trim()) return;
    L.tries++;
    var r = EB.check(L.answer, ex);
    if (r.kind === 'correct') {
      if (L.tries === 1) record(it, 'correct', null); else if (L.attempt) { L.attempt.fixed = true; save(); }
      L.phase = 'correct'; P.haptics.tap('ok');
    } else if (r.kind === 'error') {
      var t = now(), mine = L.attempt;
      var isRepeat = S.attempts.some(function (a) { return a !== mine && a.topic === it.topicId && a.tag === r.tag && EB.daysBetween(a.date, t) < 7; });
      if (L.tries === 1) record(it, 'error', r.tag);
      L.fb = { explainHe: r.explainHe, isRepeat: isRepeat };
      L.phase = 'error'; P.haptics.tap('error');
    } else {
      L.phase = L.tries === 1 ? 'unknown' : 'revealed';
    }
    draw();
    if (L.phase === 'error') focusAns(); else { var nx = document.getElementById('next') || document.getElementById('selfYes'); if (nx) try { nx.focus({ preventScroll: true }); } catch (e) {} }
  }
  function selfAssess(ok) { record(cur(), ok ? 'selfCorrect' : 'selfWrong', null); L.phase = 'revealed'; draw(); }
  function record(it, outcome, tag) {
    var t = now(), ex = it.ex;
    var a = { ex: ex.id, topic: it.topicId, answer: String(L.answer).slice(0, 300), outcome: outcome, tag: tag, date: t, day: EB.dayKey(t),
      prod: ex.type !== 'choose', isNew: !L.seen[ex.id] };
    S.attempts.push(a); L.attempt = a; L.results.push(EB.isCorrect(a)); save();
  }
  function saveVocab(k) {
    var it = cur(), ex = it.ex, v = (ex.vocab || [])[k];
    if (!v || S.vocab.some(function (x) { return x.en.toLowerCase() === v.en.toLowerCase(); })) return;
    S.vocab.push({ en: v.en, he: v.he, context: ex.modelAnswer, topic: it.topicId, box: 0, nextDue: now(), created: now() });
    save(); draw();
  }
  function nextEx() {
    if (L.i + 1 < L.items.length) { L.i++; L.answer = ''; L.tries = 0; L.attempt = null; L.fb = null; L.phase = 'answering'; draw(); window.scrollTo(0, 0); focusAns(); }
    else finishLesson(false);
  }
  function finishLesson(andExit) {
    if (L.kind === 'topic') {
      var id = L.topic.id;
      var p = S.progress[id] || (S.progress[id] = EB.newProgress());
      L.summary = EB.finishSession(p, S.attempts.filter(function (a) { return a.topic === id; }), L.results, now());
    } else {
      // חזרה מעורבת ותרגול טעויות לא משנים את לוח החזרות; התשובות נשמרות ונספרות בדיוק ובמחברת.
      if (L.kind === 'mixed') S.mixedDay = EB.dayKey(now());
      var by = {}, answered = L.items.slice(0, L.results.length);
      answered.forEach(function (it, k) {
        var b = by[it.topicId] || (by[it.topicId] = { title: (topicById(it.topicId) || {}).titleHe || it.topicId, correct: 0, total: 0 });
        b.total++; if (L.results[k]) b.correct++;
      });
      L.summary = { correct: L.results.filter(Boolean).length, total: L.results.length, byTopic: Object.keys(by).map(function (k) { return by[k]; }) };
    }
    save();
    if (andExit) return exitLesson();
    L.phase = 'summary'; draw(); window.scrollTo(0, 0);
  }

  // ---------- מחברת טעויות ----------
  function drawMistakes() {
    var log = EB.mistakeLog(S.attempts).filter(function (m) { return EX[m.attempt.ex]; });
    var open = log.filter(function (m) { return !m.resolved; });
    var h = '<h2>מחברת הטעויות</h2>';
    if (!log.length) {
      h += '<div class="card muted">עוד אין טעויות. כל משפט שבו תטעה יישמר כאן עם התיקון, ונחזור אליו עד שהוא יוצא נכון.</div>';
      return render(h);
    }
    h += open.length
      ? '<button type="button" class="btn" id="practice">תרגול ' + Math.min(open.length, 6) + ' טעויות פתוחות</button>'
      : '<div class="card"><b>כל הטעויות תוקנו 🎉</b><p class="small muted" style="margin:4px 0 0">טעויות חדשות יופיעו כאן.</p></div>';
    h += '<p class="small muted">' + open.length + ' פתוחות · ' + (log.length - open.length) + ' תוקנו</p><div class="card">';
    log.forEach(function (m) {
      var a = m.attempt, info = EX[a.ex], ex = info.ex;
      var why = a.tag ? tagName(a.topic, a.tag) : 'סימנת "טעיתי" בהשוואה';
      h += '<div class="mist"><div class="head"><div><b>' + bidi((topicById(a.topic) || {}).titleHe || '') + '</b><div class="small muted">' + esc(why) + '</div></div>'
        + '<span class="pill ' + (m.resolved ? 'ok">✓ תוקן' : 'open">פתוח') + '</span></div>'
        + '<div class="small muted">' + esc(ex.promptHe) + (ex.promptEn ? ' ' + en(ex.promptEn, 'span') : '') + '</div>'
        + (ex.type !== 'choose' && a.answer ? diffHtml(a.answer, ex, 'full') || '<div class="yours">' + en(a.answer) + '</div>' : '<div class="yours">' + en(a.answer || '—') + '</div>')
        + '<div class="right">' + enS(ex.modelAnswer) + '</div></div>';
    });
    h += '</div>';
    render(h);
    var pr = document.getElementById('practice'); if (pr) pr.onclick = startMistakePractice;
  }

  // ---------- התקדמות ----------
  function drawProgress() {
    var t = now(), h = '<h2>תחומים</h2><div class="card">';
    var mastered = topics.filter(function (tp) { return (S.progress[tp.id] || {}).state === 'mastered'; }).length;
    h += '<div class="kv"><span>דקדוק</span><span class="v">' + mastered + ' מתוך ' + topics.length + ' נושאים בשליטה</span></div>';
    ['כתיבה', 'קריאה', 'הבנת הנשמע', 'דיבור'].forEach(function (n) { h += '<div class="kv"><span>' + n + '</span><span class="v">לא נבדק עדיין</span></div>'; });
    h += '<p class="small muted" style="margin:8px 0 0">הערכה לכל תחום תגיע עם האבחון הראשוני.</p></div>';

    h += '<h2>נושאי דקדוק</h2><div class="card">';
    topics.forEach(function (tp) {
      var p = S.progress[tp.id], st = p ? p.state : 'new', acc = EB.accuracyLast10(tp.id, S.attempts), d = [];
      if (acc != null) d.push('דיוק אחרון: ' + pct(acc));
      if (p && st !== 'new') { var dd = EB.daysBetween(t, p.nextDue); d.push(dd <= 0 ? 'לחזרה היום' : 'חזרה ' + daysText(dd)); }
      h += '<div class="kv" style="display:block"><b>' + bidi(tp.titleHe) + '</b> ' + statePill(st) + (d.length ? '<div class="small muted">' + esc(d.join(' · ')) + '</div>' : '') + '</div>';
    });
    h += '</div>';

    var improved = topics.filter(function (tp) {
      var s = (S.progress[tp.id] || {}).state; return s === 'mastered' || (s === 'practicing' && (EB.accuracyLast10(tp.id, S.attempts) || 0) >= 0.8);
    });
    var needs = topics.filter(function (tp) {
      var a = EB.accuracyLast10(tp.id, S.attempts); return EB.repeatedErrorTag(tp.id, S.attempts, t) || (a != null && a < 0.6);
    });
    var nextT = EB.todayPlan(topics, S.progress, S.attempts, t)[0];
    function line(title, arr) { return '<div class="kv" style="display:block"><b>' + title + '</b><div class="small muted">' + (arr.length ? arr.map(bidi).join(', ') : 'עדיין אין') + '</div></div>'; }
    h += '<h2>במבט אחד</h2><div class="card">' + line('השתפרת ב', improved.map(function (x) { return x.titleHe; }))
      + line('עדיין דורש תרגול', needs.map(function (x) { return x.titleHe; })) + line('השלב הבא', nextT ? [nextT.topic.titleHe] : []) + '</div>';

    h += '<h2>גיבוי</h2><div class="card"><p class="small muted" style="margin:0 0 8px">ההתקדמות נשמרת במכשיר ומגובה בענן של האתר. '
      + 'כדאי לשמור גם קובץ גיבוי מדי פעם, למשל לפני החלפת טלפון.</p>'
      + '<div class="row"><button type="button" class="btn sec" id="bkSave">שמירת קובץ גיבוי</button>'
      + '<button type="button" class="btn quiet" id="bkLoad">שחזור מקובץ</button></div>'
      + '<input type="file" id="bkFile" accept="application/json,.json" hidden>'
      + (backupMsg ? '<p class="small" role="status" style="margin:8px 0 0">' + esc(backupMsg) + '</p>' : '')
      + '<details style="margin-top:10px"><summary class="small muted">מחיקת כל ההתקדמות</summary>'
      + '<p class="small muted">לפני המחיקה נשמר עותק אחרון במכשיר, ליתר ביטחון.</p>'
      + '<div class="row"><button type="button" class="btn danger" id="wipe">מחיקת כל ההתקדמות</button></div></details></div>';
    if (DEV || dayOffset()) {
      h += '<details class="card"' + (dayOffset() ? ' open' : '') + '><summary><b>כלי פיתוח</b></summary>'
        + '<p class="small">התאריך המדומה: ' + (dayOffset() ? '+' + dayOffset() + ' ימים' : 'היום') + '</p>'
        + '<div class="row"><button type="button" class="btn sec" id="dayPlus">קדם יום אחד</button><button type="button" class="btn quiet" id="dayReset">חזרה לתאריך האמיתי</button></div></details>';
    }
    render(h);
    backupMsg = null;
    var dp = document.getElementById('dayPlus'); if (dp) dp.onclick = function () { setOffset(dayOffset() + 1); draw(); };
    var dr = document.getElementById('dayReset'); if (dr) dr.onclick = function () { setOffset(0); draw(); };
    document.getElementById('wipe').onclick = function () {
      if (readOnly) return;
      if (confirm('למחוק את כל ההתקדמות, הטעויות ואוצר המילים?')) { P.storage.set(SAFE_KEY, S); S = emptyData(); save(); draw(); }
    };
    document.getElementById('bkSave').onclick = function () {
      var name = 'english-boost-backup-' + EB.dayKey(Date.now()) + '.json';
      backupMsg = P.files.save(name, EB.makeBackup(S, Date.now())) ? 'הקובץ ' + name + ' ירד למכשיר.' : 'לא הצלחתי לשמור קובץ בדפדפן הזה.';
      draw();
    };
    var fileIn = document.getElementById('bkFile');
    document.getElementById('bkLoad').onclick = function () { fileIn.value = ''; fileIn.click(); };
    fileIn.onchange = function () {
      var f = fileIn.files && fileIn.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () { restoreBackup(String(rd.result || '')); };
      rd.onerror = function () { backupMsg = 'הקובץ לא נקרא.'; draw(); };
      rd.readAsText(f);
    };
  }
  function restoreBackup(text) {
    var r = EB.readBackup(text);
    if (r.error) { backupMsg = r.error; return draw(); }
    var when = r.exportedAt ? new Date(r.exportedAt).toLocaleDateString('he-IL') : 'תאריך לא ידוע';
    var msg = 'לשחזר את הגיבוי מ-' + when + '? (' + r.counts.attempts + ' תשובות, ' + r.counts.vocab + ' ביטויים)\n'
      + 'ההתקדמות שבמכשיר עכשיו תוחלף. עותק שלה יישמר במכשיר ליתר ביטחון.';
    if (!confirm(msg)) return;
    if (!readOnly) P.storage.set(SAFE_KEY, S);
    S = r.data; readOnly = false; saveFailed = false; dataNote = null; save();
    backupMsg = 'הגיבוי שוחזר.'; draw();
  }

  // ---------- אוצר מילים ----------
  function drawVocab() {
    var t = now(), due = S.vocab.filter(function (v) { return v.nextDue <= t; }).length;
    var h = '';
    if (due) h += '<div style="margin-top:16px"><button type="button" class="btn" id="rev">חזרה על ' + due + ' ביטויים</button></div>';
    h += '<h2>ביטויים שמורים</h2><div class="card">';
    if (!S.vocab.length) h += '<p class="muted" style="margin:0">עוד לא שמרת ביטויים. אפשר לשמור אותם מתוך השיעורים.</p>';
    S.vocab.slice().sort(function (a, b) { return b.created - a.created; }).forEach(function (v) {
      h += '<div class="vitem"><div class="body"><div class="sl"><b class="en" dir="ltr" lang="en">' + esc(v.en) + '</b>' + sayBtn(v.en) + '</div>'
        + '<div>' + esc(v.he) + '</div><div class="small muted">' + en(v.context) + '</div></div>'
        + '<button type="button" class="del" data-del="' + esc(v.en) + '" aria-label="מחיקת הביטוי">🗑️</button></div>';
    });
    h += '</div>';
    render(h);
    var rv = document.getElementById('rev'); if (rv) rv.onclick = startReview;
    app.querySelectorAll('[data-del]').forEach(function (b) {
      b.onclick = function () {
        if (!confirm('למחוק את הביטוי?')) return;
        S.vocab = S.vocab.filter(function (v) { return v.en !== b.dataset.del; }); save(); draw();
      };
    });
  }
  function startReview() {
    var t = now(), q = S.vocab.filter(function (v) { return v.nextDue <= t; });
    for (var i = q.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = q[i]; q[i] = q[j]; q[j] = x; }
    R = { queue: q, i: 0, answer: '', result: null };
    draw(); window.scrollTo(0, 0); focusRev();
  }
  function focusRev() { var el = document.getElementById('rans'); if (el && !el.disabled) try { el.focus({ preventScroll: true }); } catch (e) {} }
  function drawReview() {
    var h = '<div class="top"><h1>חזרה על ביטויים</h1><button type="button" class="x" id="rexit" aria-label="יציאה מהחזרה">✕</button></div>';
    if (R.i < R.queue.length) {
      var it = R.queue[R.i];
      h += '<div class="muted small">' + (R.i + 1) + ' מתוך ' + R.queue.length + '</div><div class="card"><p class="muted" style="margin:0">איך אומרים באנגלית:</p>'
        + '<p class="big">' + esc(it.he) + '</p>'
        + '<textarea id="rans" dir="ltr" lang="en" rows="1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="English"'
        + (R.result == null ? '' : ' disabled') + '>' + esc(R.answer) + '</textarea>';
      if (R.result == null) h += '<div class="row"><button type="button" class="btn" id="rcheck">בדיקה</button></div>';
      else h += '<div class="fb ' + (R.result ? 'ok' : 'warn') + '"><h3>' + (R.result ? '✓ נכון!' : 'התשובה:') + '</h3>' + enS(it.en)
        + '<div class="small muted" style="margin-top:6px">בתוך משפט:</div>' + enS(it.context) + '</div><div class="row"><button type="button" class="btn" id="rnext">הבא ←</button></div>';
      h += '</div>';
    } else {
      h += '<div class="card"><p class="big">' + (R.queue.length ? 'סיימת את החזרה 🎉' : 'אין ביטויים לחזרה כרגע.') + '</p><button type="button" class="btn" id="rdone">חזרה</button></div>';
    }
    render(h);
    var close = function () { R = null; draw(); };
    document.getElementById('rexit').onclick = close;
    var d = document.getElementById('rdone'); if (d) d.onclick = close;
    var ta = document.getElementById('rans'), c = document.getElementById('rcheck'), n = document.getElementById('rnext');
    var doIt = function () {
      if (!R.answer.trim()) return;
      var it = R.queue[R.i]; R.result = EB.normalize(R.answer) === EB.normalize(it.en);
      var item = S.vocab.find(function (v) { return v.en === it.en; }) || it;
      EB.reviewVocab(item, R.result, now()); save(); P.haptics.tap(R.result ? 'ok' : 'error'); draw();
      var nb = document.getElementById('rnext'); if (nb) try { nb.focus({ preventScroll: true }); } catch (e) {}
    };
    if (ta) {
      ta.oninput = function () { R.answer = ta.value; if (c) c.disabled = !ta.value.trim(); };
      ta.oninput();
      ta.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); if (R.result == null) doIt(); } };
    }
    if (c) c.onclick = doIt;
    if (n) n.onclick = function () { R.i++; R.answer = ''; R.result = null; draw(); focusRev(); };
  }

  // ---------- התחלה ----------
  tabsEl.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]'); if (!b) return;
    view.tab = b.dataset.tab; draw(); window.scrollTo(0, 0);
  });
  P.install.onChange(function () { if (!L && !R && view.tab === 'today') draw(); });
  Promise.all(TOPIC_FILES.map(function (f) {
    return fetch('content/' + f).then(function (r) { if (!r.ok) throw new Error(f + ': ' + r.status); return r.json(); })
      .catch(function (e) { throw new Error(f + ': ' + (e && e.message || e)); });
  })).then(function (list) {
    topics = list.sort(function (a, b) { return a.order - b.order; });
    topics.forEach(function (t) { t.exercises.forEach(function (e) { EX[e.id] = { ex: e, topicId: t.id }; }); });
  }).catch(function (e) {
    loadError = 'לא הצלחתי לטעון את התרגילים. בדוק את החיבור לאינטרנט ונסה שוב.\n' + (e && e.message || e);
  }).then(draw);
})();
</script>
<script type="module" src="../shared/cloud.js"></script>
<script id="persist-storage">
/* שמירה קבועה במכשיר: מבקש מהדפדפן לא למחוק את ההתקדמות כשחסר מקום (כמו בשאר הערכות). */
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});}catch(e){}
</script>
</body>
