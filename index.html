<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מרכזי הלמידה — משפחת עמיחי</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Arial,sans-serif;background:#eef3ff;margin:0;min-height:100vh;color:#1c2b4a}
.wrap{max-width:520px;margin:0 auto;width:92%;text-align:center;padding:28px 0 40px}
h1{font-size:30px;margin:8px 0 6px}
p.lead{color:#5a6a8a;margin:0 0 18px}
.card{background:#fff;border-radius:24px;padding:8px 8px 14px;margin:14px 0;box-shadow:0 4px 18px rgba(40,70,140,.12);border-top:8px solid #4a7dff;text-align:center}
.card.g1{border-top-color:#ff6b9d}
.card.g4{border-top-color:#18a058}
a.pick{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#1c2b4a;padding:8px 8px 0;min-height:44px}
a.pick .av{width:112px;height:112px;display:block}
a.pick .who{font-size:28px;font-weight:900;margin-top:2px}
a.pick .grade{font-size:16px;font-weight:600;color:#5a6a8a}
a.go{display:flex;align-items:center;justify-content:center;background:#4a7dff;color:#fff;border-radius:16px;padding:14px 12px;font-size:22px;font-weight:900;text-decoration:none;min-height:56px;margin:10px 12px 2px;box-shadow:0 4px 0 rgba(30,50,120,.18)}
a.go:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(30,50,120,.18)}
.card.g1 a.go{background:#ff6b9d}
.card.g4 a.go{background:#18a058}
a.more,a.prep{display:inline-flex;align-items:center;justify-content:center;color:#3a4a6a;font-size:16px;font-weight:700;text-decoration:none;min-height:48px;padding:8px 12px}
a.prep{display:flex;margin:4px 12px 0;background:#efe7ff;border-radius:14px;color:#4c1d95}
.foot{margin-top:8px}
.foot a{color:#3a4a6a;font-weight:800}
</style>
</head>
