<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מרכזי הלמידה</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:#eef3ff;color:#1c2b4a}
.wrap{max-width:520px;margin:0 auto;padding:16px 14px 48px}
h1{font-size:26px;margin:8px 0 4px;font-weight:800;text-align:center}
.lead{text-align:center;color:#5a6a8a;font-weight:700;margin:0 0 14px}
.grades{display:flex;flex-direction:column;gap:10px}
a.grade{display:block;background:#fff;border-radius:18px;padding:14px 16px;text-decoration:none;color:#1c2b4a;min-height:84px;box-shadow:0 3px 12px rgba(40,70,140,.08);border-right:8px solid #7c5cbf}
a.grade .nm{display:block;font-size:22px;font-weight:800}
a.grade small{display:block;font-weight:700;color:#5a6a8a;font-size:15px;margin-top:2px}
a.grade.g4{border-right-color:#18a058}
a.grade.g6{border-right-color:#4a7dff}
a.grade.math{border-right-color:#6a4fd0}
.note{color:#6a7b96;font-size:14px;line-height:1.5;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>מרכזי הלמידה</h1>
  <p class="lead">בוחרים כיתה, ונכנסים לאתר שלה</p>
  <div class="grades">
    <a class="grade" href="grade1-learning/"><span class="nm">כיתה א׳</span><small>קריאה, אותיות ומשחקים</small></a>
    <a class="grade g4" href="grade4-learning/"><span class="nm">כיתה ד׳</span><small>מרכז הלמידה</small></a>
    <a class="grade g6" href="grade6-learning/"><span class="nm">כיתה ו׳</span><small>מרכז הלמידה</small></a>
    <a class="grade math" href="math-test-prep/"><span class="nm">מתמטיקה</span><small>כיתה ו׳ · מסלול השבוע למבחן</small></a>
  </div>
  <p class="note">בכל כיתה בוחרים או יוצרים פרופיל. המטבעות, הרצף וההתקדמות נשמרים לפרופיל הזה במכשיר, בנפרד משאר הפרופילים.</p>
</div>
</body>
</html>
