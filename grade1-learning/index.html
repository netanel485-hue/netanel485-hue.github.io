<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- הקראה: Google TTS דוחה בקשות עם Referer של צד שלישי; בלי השורה הזאת ההקראה נכשלת -->
<meta name="referrer" content="no-referrer">
<title>מרכז הלמידה — כיתה א'</title>
<style>
:root{--pink:#ff6b9d;--purple:#7c5cbf;--bg:#fff7fb;--card:#ffffff;--ink:#33305e;--good:#2fbf71;--bad:#ff5a5a;--gold:#ffb800}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:30px;text-align:center;margin:8px 0 2px}
.sub{text-align:center;color:#5b5480;margin:0 0 14px;font-size:16px}
.hidden{display:none!important}
.bank{background:linear-gradient(135deg,#ffe29a,#ffb800);border-radius:20px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 14px rgba(255,184,0,.35);margin-bottom:14px}
.bank .coins{font-size:26px;font-weight:800}
.bank .goal{font-size:14px;text-align:left}
.dots{display:flex;gap:4px;margin-top:4px;justify-content:flex-end}
.dot{width:14px;height:14px;border-radius:50%;background:#fff6; border:2px solid #fff}
.dot.on{background:#7c5cbf;border-color:#7c5cbf}
.booklet{font-size:22px;font-weight:800;margin:18px 0 8px;color:var(--purple)}
.tabs{display:flex;gap:12px;margin:14px 0 4px}
.tabbtn{flex:1;border:4px solid #e7e2ff;border-radius:22px;padding:14px 6px;font-size:24px;font-weight:800;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 4px 0 #d9d2ff}
.tabbtn .emo{font-size:44px;display:block;line-height:1.1}
.tabbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #d9d2ff}
#tabHe.active{background:#d9f7e8;border-color:var(--good);box-shadow:0 4px 0 #1e9e55}
#tabMath.active{background:#ffe9c7;border-color:#ff9f1c;box-shadow:0 4px 0 #e07f00}
#tabEng.active{background:#e0e7ff;border-color:#6366f1;box-shadow:0 4px 0 #4338ca}
.engcard{background:#eef2ff;border:3px solid #c7d2fe;border-radius:22px;padding:20px 14px;text-align:center;margin:12px 0}
.motiv{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0 2px}
.motiv .chip{background:#fff;border:3px solid #ffe1ee;border-radius:999px;padding:6px 12px;font-size:16px;font-weight:800}
.motiv .chip.fire{border-color:#ffb800;background:#fff8e1}
.focusbox{background:#fffbe6;border:3px solid #ffd166;border-radius:18px;padding:10px 10px 12px;margin:14px 0}
.focushead{font-size:20px;font-weight:800;text-align:center;margin-bottom:8px}
.celeb{font-size:24px;font-weight:800;text-align:center;margin:10px 0}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.page-btn{position:relative;background:var(--card);border:3px solid #e7e2ff;border-radius:18px;padding:12px 6px;text-align:center;cursor:pointer;box-shadow:0 3px 8px rgba(60,50,140,.08)}
.page-btn:active{transform:scale(.97)}
.page-btn .big{font-size:34px;display:block}
.page-btn .ttl{font-size:14px;font-weight:700;display:block;margin-top:2px}
.page-btn .stars{font-size:13px;display:block;min-height:18px}
.page-btn.done{border-color:var(--good);background:#effff5}
.page-btn.locked{opacity:.45}
.bigbtn{display:block;width:100%;border:none;border-radius:20px;padding:16px;font-size:21px;font-weight:800;cursor:pointer;margin:10px 0;color:#fff;background:var(--pink);box-shadow:0 5px 0 #d64f80}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #d64f80}
.bigbtn.purple{background:var(--purple);box-shadow:0 5px 0 #5a41a0}
.bigbtn.purple:active{box-shadow:0 2px 0 #5a41a0}
.bigbtn.ghost{background:#fff;color:var(--purple);border:3px solid #e7e2ff;box-shadow:0 5px 0 #d9d2ff}
.learnletter{font-size:110px;text-align:center;line-height:1.1}
.sylrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.syl{font-size:34px;background:#efeaff;border:3px solid #d9d2ff;border-radius:16px;padding:8px 16px;cursor:pointer;font-weight:700}
.syl:active{background:#dcd2ff}
.wordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;margin:12px 0}
.wcard{background:#fff;border:3px solid #ffe1ee;border-radius:16px;padding:10px 4px;text-align:center;cursor:pointer}
.wcard .e{font-size:40px;display:block}
.wcard .w{font-size:24px;font-weight:700}
.qinst{font-size:20px;text-align:center;margin:6px 0 2px;min-height:28px}
.qprompt{text-align:center;margin:8px 0}
.qprompt .emoji{font-size:88px}
.qprompt .word{font-size:46px;font-weight:800}
.qprompt .gapword{font-size:46px;font-weight:800;letter-spacing:2px}
.spk{display:inline-block;background:#ffe29a;border:3px solid #ffb800;border-radius:50%;width:64px;height:64px;font-size:30px;line-height:58px;cursor:pointer;vertical-align:middle}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.opt{background:#fff;border:4px solid #e7e2ff;border-radius:20px;padding:16px 6px;font-size:40px;font-weight:800;cursor:pointer;text-align:center;min-height:92px}
.opt.small{font-size:30px}
.opt.emoji{font-size:52px}
.opt.right{border-color:var(--good);background:#eafff3}
.opt.wrong{border-color:var(--bad);background:#ffecec;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opt:disabled{opacity:.85}
.prog{height:14px;background:#eee9ff;border-radius:8px;overflow:hidden;margin:10px 0}
.prog>div{height:100%;background:var(--pink);transition:width .3s}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.tile{font-size:36px;font-weight:800;background:#fff;border:4px solid #ffd166;border-radius:14px;width:58px;height:58px;cursor:pointer}
.tile.used{visibility:hidden}
.slots{display:flex;gap:8px;justify-content:center;margin:10px 0;min-height:60px}
.slot{font-size:36px;font-weight:800;background:#efeaff;border:3px dashed #bdb2ff;border-radius:14px;width:58px;height:58px;line-height:52px;text-align:center}
.slot.filled{border-style:solid;background:#eafff3;border-color:var(--good)}
.endbox{text-align:center;padding:20px 0}
.endbox .stars{font-size:52px}
.endbox .msg{font-size:26px;font-weight:800;margin:8px 0}
table.ptable{width:100%;border-collapse:collapse;font-size:15px}
table.ptable td,table.ptable th{border-bottom:1px solid #eee;padding:7px 4px;text-align:right}
.bar{height:12px;background:#eee9ff;border-radius:6px;overflow:hidden}
.bar>div{height:100%;background:var(--good)}
.note{font-size:13px;color:#5b5480}
.objs{font-size:38px;text-align:center;line-height:1.35;letter-spacing:2px}
.eq{font-size:42px;font-weight:800;text-align:center;margin:8px 0;direction:ltr}
.gone{filter:grayscale(1);opacity:.35}
.shpbtn{display:inline-flex;flex-direction:column;align-items:center;gap:2px;margin:4px}
/* ---- navigation illustrations + read-aloud (STAGE 2.2) ---- */
.navart{display:block;height:46px;margin:2px auto 0}
.navart svg{height:46px;width:46px}
.page-btn .spkbadge{position:absolute;top:4px;right:4px;inset-inline-start:4px;font-size:14px;line-height:1;background:#fff3cd;border:2px solid #ffca28;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.page-btn.speaking{border-color:#ffb800;background:#fff8e1}
.bigbtn.speaking{background:#ffe29a;border-color:#ffb800;color:#7a5b00}
/* ---- STAGE 3.6: continue card + folded home controls ---- */
.continuecard{background:linear-gradient(135deg,#ffe9f4,#efeaff);border:3px solid var(--pink);border-radius:22px;padding:16px 14px 12px;margin:6px 0 14px;text-align:center;box-shadow:0 4px 14px rgba(255,107,157,.25)}
.continuecard .cc-label{font-size:19px;font-weight:800;color:var(--purple)}
.continuecard .cc-title{font-size:24px;font-weight:800;margin:6px 0 2px}
.continuecard .cc-sub{font-size:16px;color:#6a6590;margin-bottom:6px}
.continuecard .bigbtn{margin:8px 0 4px}
.homefold{margin:14px 0 4px}
.homefold>summary{cursor:pointer;font-size:18px;font-weight:800;color:var(--purple);text-align:center;padding:10px;list-style:none}
.focusbox>summary{cursor:pointer;list-style:none}
/* ---- STAGE 4.3: question counter + spoken/visual error feedback ---- */
.qcount{text-align:center;font-size:18px;font-weight:800;color:var(--purple);margin:2px 0 4px}
.fbmark{font-size:30px;margin-inline-start:4px;vertical-align:middle}
.fbmark.good{color:#1e9e55}
.fbmark.bad{color:#d32f2f}
.tile{position:relative}
.tile .fbmark{position:absolute;top:0;left:2px;font-size:16px;line-height:1;margin:0}

/* ---- STAGE 5: focus, mobile, reduced motion, unified compact buttons ---- */
button:focus-visible,a:focus-visible,summary:focus-visible,[role="button"]:focus-visible,input:focus-visible{outline:3px solid #7c5cbf;outline-offset:2px}
#qSpk{cursor:pointer}
.btn-primary,.btn-secondary,.btn-ghost,.btn-danger{display:inline-block;border-radius:16px;padding:12px 20px;font-size:18px;font-weight:800;font-family:inherit;cursor:pointer;min-height:48px;text-align:center}
.btn-primary{background:var(--pink);color:#fff;border:none;box-shadow:0 4px 0 #d64f80}
.btn-secondary{background:var(--purple);color:#fff;border:none;box-shadow:0 4px 0 #5a41a0}
.btn-ghost{background:#fff;color:var(--purple);border:3px solid #e7e2ff;box-shadow:0 4px 0 #d9d2ff}
.btn-danger{background:#d32f2f;color:#fff;border:none;box-shadow:0 4px 0 #9c2222}
.btn-primary:active,.btn-secondary:active,.btn-ghost:active,.btn-danger:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:480px){
h1{font-size:clamp(24px,7vw,30px)}
.tabs{gap:8px}
.tabbtn{font-size:20px;padding:12px 4px}
.tabbtn .emo{font-size:36px}
.bank{flex-wrap:wrap;gap:8px}
.bank .goal{text-align:right}
.learnletter{font-size:clamp(72px,22vw,110px)}
.qprompt .word,.qprompt .gapword{font-size:clamp(32px,10vw,46px)}
.qprompt .emoji{font-size:clamp(64px,18vw,88px)}
.eq{font-size:clamp(28px,8vw,42px)}
.continuecard .cc-title{font-size:21px}
}
@media (max-width:360px){
.pages,.wordgrid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.opt{font-size:34px}
.opt.small{font-size:26px}
.syl{font-size:30px}
}
</style>
<style id="g1-fun-css">
/* ==========================================================================
   G1-FUN — שכבת עיצוב לכיתה א׳ (גילאי 6–7). 11/11/2026
   רק משוב ויזואלי: המשוב הקולי ("כל הכבוד", "נסי שוב") כבר קיים, לכן אין כאן צלילים.
   להסרה: למחוק את תגית ה-style עם id=g1-fun-css ואת תגית ה-script עם id=g1-fun-js.
   ========================================================================== */
/* תשובה נכונה: קפיצה גדולה וזוהר */
.opt.right{animation:g1pop .55s cubic-bezier(.2,1.7,.4,1);box-shadow:0 0 0 6px rgba(47,191,113,.25)}
.slot.filled{animation:g1pop .4s cubic-bezier(.2,1.7,.4,1)}
@keyframes g1pop{0%{transform:scale(1)}35%{transform:scale(1.14) rotate(-2deg)}65%{transform:scale(.97) rotate(1deg)}100%{transform:scale(1)}}
/* כפתורים מרגישים "לחיצים" */
.opt,.tile,.page-btn,.wcard,.syl{transition:transform .1s ease}
.opt:active:not(:disabled),.tile:active,.wcard:active{transform:scale(.94)}
.opt{box-shadow:0 5px 0 #e7e2ff}
.opt.right{box-shadow:0 5px 0 #8fe0b3,0 0 0 6px rgba(47,191,113,.22)}
/* פס התקדמות: שביל עם כוכב שמתקדם */
.prog{height:20px;overflow:visible;position:relative;background:#eee9ff;border-radius:999px}
.prog>div{position:relative;border-radius:999px;background:linear-gradient(90deg,#ffb800,#ff6b9d);
  transition:width .5s cubic-bezier(.3,1.5,.5,1)}
.prog>div::after{content:"⭐";position:absolute;left:-14px;top:50%;transform:translateY(-50%);font-size:26px;line-height:1;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
/* מסך סיום: הכוכבים נכנסים בקפיצה */
.endbox .stars{animation:g1stars .8s cubic-bezier(.2,1.6,.4,1) both}
.endbox .msg{animation:g1in .5s .25s ease both}
@keyframes g1stars{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes g1in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* דף שהושלם בוהק קצת */
.page-btn.done{box-shadow:0 0 0 3px rgba(47,191,113,.18),0 3px 8px rgba(60,50,140,.08)}
/* פיצוץ אימוג׳ים */
.g1-p{position:fixed;z-index:80;pointer-events:none;font-size:28px;line-height:1;will-change:transform,opacity;
  animation:g1p .9s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes g1p{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}70%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(var(--r))}}

/* ניגודיות (11/11/2026): טקסט לבן על הוורוד המקורי #ff6b9d היה 2.7:1. ורוד עמוק יותר: 4.6:1 */
.bigbtn:not(.purple):not(.ghost):not(.speaking){background:#d6336c;box-shadow:0 5px 0 #a3214f}
.bigbtn:not(.purple):not(.ghost):not(.speaking):active{box-shadow:0 2px 0 #a3214f}
.btn-primary{background:#d6336c;box-shadow:0 4px 0 #a3214f}
</style>


<style id="g1-match-css">
/* ==========================================================================
   G1-MATCH — כיתה א׳ באותה שפה כמו דף הבית (14/11/2026):
   רקע שמנת, דיו ירוק כהה, ורוד של ריבוע כיתה א׳ (#d6336c), מסגרות ירקרקות במקום סגול,
   בלי מעברי צבע, וכותרת ורודה עם 🐣 כמו הריבוע. הכותרת היא חלק מהדף, לכן אין "קפיצה" בטעינה.
   להסרה: למחוק את הבלוק הזה ולהחזיר את ה-h1 ואת site-bar.js.
   ========================================================================== */
:root{--bg:#FAF6EB;--ink:#1E4634;--pink:#d6336c;--purple:#a3214f;--line-g1:#D8E4D4;--soft-g1:#4F6B5D}
body{background:var(--bg)}
.g1-hero{position:relative;display:flex;align-items:center;gap:12px;background:#d6336c;color:#fff;border-radius:28px;padding:16px 18px;margin:4px 0 12px;
  box-shadow:0 6px 0 #a3214f,0 10px 18px rgba(30,70,50,.15);overflow:hidden}
.g1-hero::before{content:"";position:absolute;width:130%;height:70%;top:-35%;right:-15%;border-radius:50%;background:rgba(255,255,255,.14)}
.g1-hero>*{position:relative}
.g1-pal{font-size:46px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.g1-hero h1{margin:0;font-size:30px;font-weight:900;color:#fff;text-align:right;flex:1}
.g1-home{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:#fff;text-decoration:none;font-size:24px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.g1-home:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.sub,.note,.continuecard .cc-sub{color:var(--soft-g1)!important}
.booklet,.qcount,.homefold>summary,.continuecard .cc-label{color:var(--ink)!important}
/* כרטיסים: לבן, מסגרת ירקרקה, בלי מעברי צבע */
.continuecard{background:#fff!important;border:3px solid #d6336c!important;box-shadow:0 5px 0 rgba(214,51,108,.25)!important}
.bank{background:#FFF3D6!important;border:2px solid #F59E0B;box-shadow:0 4px 0 rgba(245,158,11,.3)!important}
.dot.on{background:#d6336c;border-color:#d6336c}
.tabbtn,.page-btn,.opt,.bigbtn.ghost,.btn-ghost{border-color:var(--line-g1)!important}
.tabbtn{box-shadow:0 4px 0 var(--line-g1)}
.page-btn{box-shadow:0 4px 0 rgba(214,51,108,.18)!important}
.page-btn.done{border-color:var(--good)!important}
.opt:not(.right):not(.wrong){box-shadow:0 5px 0 var(--line-g1)!important}
.bigbtn.ghost,.btn-ghost{color:var(--ink)!important;box-shadow:0 5px 0 var(--line-g1)!important}
.bigbtn.purple,.btn-secondary{background:var(--ink)!important;box-shadow:0 5px 0 #0f2a1e!important}
.btn-primary{background:#d6336c;box-shadow:0 4px 0 #a3214f}
.prog,.bar{background:#EAF4E6!important}
.prog>div{background:#d6336c!important}
.syl,.slot{background:#FBEAF0!important;border-color:#F4C0D1!important}
.motiv .chip{border-color:#F4C0D1}
button:focus-visible,a:focus-visible,summary:focus-visible,[role="button"]:focus-visible,input:focus-visible{outline-color:#F59E0B!important}
#grid-ג{opacity:.6}
</style>
</head>
<body>
<div class="wrap">
  <!-- HOME -->
  <div id="screen-home">
    <header class="g1-hero"><span class="g1-pal" aria-hidden="true">🐣</span><h1>כיתה א׳</h1><a class="g1-home" href="../" aria-label="מרכזי הלמידה">🏠</a></header>
    <p class="sub">לומדים לקרוא עם "צלילים מספרים"</p>
    <div class="continuecard" id="continueCard">
      <div class="cc-label">💪 המשיכי מאיפה שהפסקת</div>
      <div class="cc-title" id="ccTitle"></div>
      <div class="cc-sub" id="ccSub"></div>
      <button class="bigbtn" id="btnContinue">▶️ ממשיכים!</button>
    </div>
    <div class="bank">
      <div><div class="coins">🪙 <span id="bankCoins">0</span></div><div class="note">מטבעות בבנק הידע</div></div>
      <div class="goal"><div id="goalText"></div><div class="dots" id="weekDots"></div></div>
    </div>
    <div class="motiv" id="motivRow"></div>
    <div class="tabs" id="homeTabs">
      <button class="tabbtn" id="tabHe"><span class="emo">📖</span><span>עברית</span></button>
      <button class="tabbtn" id="tabMath"><span class="emo">🔢</span><span>חשבון</span></button>
      <button class="tabbtn" id="tabEng"><span class="emo">🔤</span><span>אנגלית</span></button>
    </div>
    <div id="booklets"></div>
    <details class="homefold" id="homeMore"><summary>⚙️ עוד אפשרויות</summary>
    <button class="bigbtn purple" id="btnReview">🔀 חזרה על הכול</button>
    <button class="bigbtn ghost" id="btnNavSay">🔊 תקשיבי לכל האפשרויות</button>
    <button class="bigbtn ghost" id="btnGoal">🎯 היעד השבועי שלי</button>
    <button class="bigbtn ghost" id="btnParent">👨‍👩‍👧 מסך הורים</button>
    </details>
  </div>

  <!-- LEARN -->
  <div id="screen-learn" class="hidden">
    <button class="bigbtn ghost" id="learnBack">⬅ חזרה</button>
    <div id="learnBody"></div>
    <button class="bigbtn" id="learnStart">▶️ מתחילים לשחק!</button>
  </div>

  <!-- QUIZ -->
  <div id="screen-quiz" class="hidden">
    <button class="bigbtn ghost" id="quizBack">⬅ חזרה</button>
    <div class="prog"><div id="qProg" style="width:0%"></div></div>
    <div class="qcount" id="qCount"></div>
    <div class="qinst" id="qInst"></div>
    <div class="qprompt" id="qPrompt"></div>
    <div id="qBody"></div>
  </div>

  <!-- END -->
  <div id="screen-end" class="hidden">
    <div class="endbox">
      <div class="stars" id="endStars"></div>
      <div class="msg" id="endMsg"></div>
      <div id="endCoins" style="font-size:19px"></div>
      <div class="celeb" id="endCeleb"></div>
      <button class="bigbtn" id="endAgain">🔁 עוד פעם</button>
      <button class="bigbtn purple" id="endHome">🏠 הביתה</button>
    </div>
  </div>

  <!-- PARENT -->
  <div id="screen-parent" class="hidden">
    <button class="bigbtn ghost" id="parentBack">⬅ חזרה</button>
    <h2 style="text-align:center">מסך הורים</h2>
    <div id="parentBody"></div>

var curAudio = null;

function speak(key, delay, onend) {
  var src = AUDIO[key];
  if (!src) { if (onend) onend(); return; }
  if (!onend) seqToken++;
  var go = function () {
    try {
      if (curAudio) curAudio.pause();
      curAudio = new Audio(src);
      curAudio.preload = 'auto';
      if (onend) {
        var done = false;
        var finish = function () { if (!done) { done = true; onend(); } };
        curAudio.onended = finish;
        curAudio.onloadedmetadata = function () { setTimeout(finish, (curAudio.duration || 2) * 1000 + 2500); };
      }
      var p = curAudio.play();
      if (p && p.catch) p.catch(function () {});
    } catch (e) { if (onend) onend(); }
  };
  if (delay) setTimeout(go, delay); else go();
}
function speakSeq(keys, delay) {
  var list = keys.filter(function (k) { return k && AUDIO[k]; });

}

/* ---- navigation read-aloud: Google TTS (tl=he) primary, device voice fallback ---- */
var navTtsAudio = null;
var navTtsSeq = 0;
var navTapSeq = 0;
function navStripNikud(s){ return String(s || '').replace(/[\u0591-\u05BD\u05BF\u05C1-\u05C2\u05C4-\u05C5\u05C7]/g, ''); }
function navCleanLabel(s){
  var t = navStripNikud(s);
  t = t.replace(/[·—–:]/g, ', ');
  t = t.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{FE0F}\u{200D}]/gu, ' ');
  t = t.replace(/\s+/g, ' ').trim();
  return t;
}
function navTtsStop(){
  navTtsSeq++;
  if (navTtsAudio) { try { navTtsAudio.pause(); } catch (e) {} navTtsAudio = null; }
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
}
function navTtsSpeakDevice(text, seq, done){
  var finished = false;
  var finish = function(){ if (finished) return; finished = true; done(); };
  if (!('speechSynthesis' in window)) { finish(); return; }
  var wd = setTimeout(function(){ try { speechSynthesis.cancel(); } catch (e) {} finish(); }, 6000);
  try {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'he-IL'; u.rate = 0.9;
    try {
      var vs = speechSynthesis.getVoices() || [];
      for (var i = 0; i < vs.length; i++) { if (/^he/i.test(vs[i].lang || '')) { u.voice = vs[i]; break; } }
    } catch (e) {}
    u.onend = function(){ clearTimeout(wd); finish(); };
    u.onerror = function(){ clearTimeout(wd); finish(); };
    if (seq !== navTtsSeq) { clearTimeout(wd); finish(); return; }
    try { speechSynthesis.cancel(); } catch (e) {}
    setTimeout(function(){
      if (seq !== navTtsSeq) { clearTimeout(wd); finish(); return; }
      try { speechSynthesis.speak(u); } catch (e) { clearTimeout(wd); finish(); }
    }, 60);
  } catch (e) { clearTimeout(wd); finish(); }
}
/* Speaks one short label; done() always runs — after speech, on error, or at the 4s hard cap. */
function navSay(text, done){
  var clean = navCleanLabel(text);
  var finished = false;
  var finish = function(){ if (finished) return; finished = true; if (done) done(); };
  if (!clean) { finish(); return; }
  var seq = ++navTtsSeq;
  if (navTtsAudio) { try { navTtsAudio.pause(); } catch (e) {} navTtsAudio = null; }
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
  var cap = setTimeout(function(){ if (seq === navTtsSeq) navTtsStop(); finish(); }, 4000);
  var url = 'https://translate.google.com/translate_tts?ie=UTF-8&tl=he&client=tw-ob&q=' + encodeURIComponent(clean);
  /* STAGE 4.3 fix (proven in grade-2 kit, commit e067ed83): Google Translate
     TTS returns HTTP 404 for requests carrying a third-party Referer, and a
     real browser's <audio> sends the page's Referer (github.io) by default —
     so `new Audio(url)` fails in a real browser and falls back to the device
     voice (wrong Hebrew accent). Create the element with NO src, set
     referrerPolicy BEFORE assigning src, so the request goes out with no
     Referer — exactly like a working curl request. */
  var a = new Audio();
  try { a.referrerPolicy = 'no-referrer'; } catch (e) {}
  a.src = url;
  navTtsAudio = a;
  a.onended = function(){ clearTimeout(cap); if (navTtsAudio === a) navTtsAudio = null; finish(); };
  a.onerror = function(){ clearTimeout(cap); navTtsSpeakDevice(clean, seq, finish); };
  var pr = null;
  try { pr = a.play(); } catch (e) { clearTimeout(cap); navTtsSpeakDevice(clean, seq, finish); return; }
  if (pr && pr.catch) pr.catch(function(){ clearTimeout(cap); navTtsSpeakDevice(clean, seq, finish); });
}
/* Tap a nav button: announce its label, then open it (latest tap wins). */
function navBtnClick(b, idx){
  b.setAttribute('role', 'button');
  b.setAttribute('tabindex', '0');
  b.setAttribute('aria-label', navPageLabel(DATA.PAGES[idx]));
  b.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); b.onclick(); } };
  b.onclick = function(){
    navStopReadAll();
    var my = ++navTapSeq;
    b.classList.add('speaking');
    navSay(navPageLabel(DATA.PAGES[idx]), function(){
      b.classList.remove('speaking');
      if (my !== navTapSeq) return;
      openLearn(idx);
    });
  };
}

}

  navReadAllOn = false;
  navReadAllSeq++;

}
function visibleNavLabels(){
  var out = [];
  if (curTab === 'eng') { out.push('משחק האנגלית'); return out; }
  if (curTab === 'math') {
    out.push('חשבון');
    DATA.PAGES.forEach(function(pg){ if (pg.booklet === 'M') out.push(navPageLabel(pg)); });
    return out;
  }
  out.push('חוברת א');
  DATA.PAGES.forEach(function(pg){ if (pg.booklet === 'א') out.push(navPageLabel(pg)); });
  out.push('חוברת ב');
  DATA.PAGES.forEach(function(pg){ if (pg.booklet === 'ב') out.push(navPageLabel(pg)); });
  return out;
}
function navReadAll(){
  if (navReadAllOn) { navReadAllOn = false; navTtsStop(); updateNavSayBtn(); return; }
  navReadAllOn = true;
  updateNavSayBtn();
  var my = ++navReadAllSeq;
  var items = visibleNavLabels();
  var i = 0;
  var step = function(){
    if (!navReadAllOn || my !== navReadAllSeq) return;
    if (i >= items.length) { navReadAllOn = false; updateNavSayBtn(); return; }
    var label = items[i++];
    navSay(label, function(){
      if (!navReadAllOn || my !== navReadAllSeq) return;
      setTimeout(step, 350);
    });
  };
  step();
}


/* ================= helpers ================= */
var FINAL = {'מ':'ם','נ':'ן','פ':'ף','צ':'ץ','כ':'ך'};
var FINALS = [['מ','ם','ים'],['נ','ן','גן'],['צ','ץ','עץ'],['פ','ף','קוף'],['כ','ך','מלך']];
var BASE = {'ם':'מ','ן':'נ','ף':'פ','ץ':'צ','ך':'כ'};
function baseOf(ch) { return BASE[ch] || ch; }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pickN(a, n) { return shuffle(a).slice(0, n); }

function show(id) {

function syllable(l, v) {

  if (v === 'A') return b + 'ַ';
  if (v === 'i') return b + 'ִי';
  if (v === 'e') return b + 'ֶ';
  if (v === 'o') return b + 'וֹ';

function starsForBest(best) { return best === undefined ? 0 : best >= 8 ? 3 : best >= 6 ? 2 : best >= 4 ? 1 : 0; }

  DATA.PAGES.forEach(function (p) { n += starsForBest((prog.pages[p.id] || {}).best); });
  return n;
}
function dayStreak() {
  var d = new Date(), n = 0;
  if (!prog.days[todayKey()]) d.setDate(d.getDate() - 1);
  while (prog.days[d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate()]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function bookletDone(bk) {
  var pages = DATA.PAGES.filter(function (p) { return p.booklet === bk; });
  return pages.length > 0 && pages.every(function (p) { return (prog.pages[p.id] || {}).mastered; });
}
var STAR_MILESTONES = [10, 25, 50, 100];
function reachedMilestones() {
  var out = [];

  STAR_MILESTONES.forEach(function (m) { if (s >= m) out.push({key: 'stars' + m, label: '⭐ ' + m + ' כוכבים!'}); });
  if (bookletDone('א')) out.push({key: 'bookA', label: '🏆 חוברת א׳ הושלמה!'});
  if (bookletDone('ב')) out.push({key: 'bookB', label: '🏆 חוברת ב׳ הושלמה!'});
  if (bookletDone('M')) out.push({key: 'bookM', label: '🏆 כל משחקי החשבון הושלמו!'});
  return out;
}
function celebrateNew() {
  if (!prog.celebrated) prog.celebrated = {};
  var fresh = reachedMilestones().filter(function (m) { return !prog.celebrated[m.key]; });
  if (!fresh.length) return '';
  fresh.forEach(function (m) { prog.celebrated[m.key] = 1; });

  el('qSpk').onkeydown = function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); speakSeq(q.seq || [q.inst, q.audio, q.audio2]); } };
  var body = el('qBody'); body.innerHTML = '';
  // reademoji: the word IS the answer — auto-play the instruction only; the word stays on the 🔊 hint button
  if (q.type === 'reademoji') speakSeq([q.inst], 300);
  else speakSeq(q.seq || [q.inst, q.audio, q.audio2], 300);
  if (q.type === 'build') { renderBuild(q, body); return; }
  var grid = document.createElement('div'); grid.className = 'opts';
  q.options.forEach(function (o) {
    var b = document.createElement('button'); b.className = 'opt' + (q.optClass ? ' ' + q.optClass : ''); b.textContent = o;
    b.onclick = function () { answer(q, o, b, grid); };
    grid.appendChild(b);
  });
  body.appendChild(grid);
}
function recordItem(q, okFirst) {
  var it = prog.items[q.itemKey] || {wrong: 0, right: 0};
  if (okFirst) it.right++; else it.wrong++;
  prog.items[q.itemKey] = it; save();
}
/* ================= STAGE 4.3: spoken + visual error feedback =================
   Finding א־מ1: a wrong answer gave only red + shake — no word, sound or
   symbol — and a right answer had no ✓. Now: a wrong tap speaks "נסי שוב"
   and marks the tapped button with ❌; a right tap marks it with ✓.
   Voice: NO embedded "נסי שוב" clip exists in AUDIO (only praise|0..3),
   so this reuses navSay() — Google Translate TTS (tl=he) primary, device
   speechSynthesis as FALLBACK only (its Hebrew accent is wrong). Before
   speaking, the running question read-aloud is stopped (seqToken++ kills
   the speakSeq chain, curAudio is paused) so the two voices never overlap.
   No-penalty retry is unchanged: a wrong answer only disables that one
   button, never blocks the round, never costs coins or score. */
function markBtn(btn, sym, cls) {
  var m = document.createElement('span');
  m.className = 'fbmark ' + cls;
  m.textContent = sym;
  btn.appendChild(m);
}
function sayTryAgain() {
  try { seqToken++; } catch (e) {}
  try { if (curAudio) curAudio.pause(); } catch (e) {}
  navSay('נסי שוב');
}
function answer(q, chosen, btn, grid) {
  if (chosen === q.correct) {
    btn.classList.add('right');
    markBtn(btn, '✓', 'good');
    Array.prototype.forEach.call(grid.children, function (c) { c.disabled = true; });
    if (firstTry) { roundScore++; recordItem(q, true); } else recordItem(q, false);
    praise();
    setTimeout(nextQ, 1200);
  } else {
    btn.classList.add('wrong'); btn.disabled = true;
    markBtn(btn, '❌', 'bad');
    sayTryAgain();
    if (firstTry) { firstTry = false; }
  }
}
function renderBuild(q, body) {
  var word = q.word;
  var slots = document.createElement('div'); slots.className = 'slots';
  for (var i = 0; i < word.length; i++) { var s = document.createElement('div'); s.className = 'slot'; slots.appendChild(s); }
  body.appendChild(slots);
  var letters = cumLetters(roundReview ? DATA.PAGES.length - 1 : roundPage);
  var extra = pickN(letters.filter(function (l) { return word.indexOf(l) < 0 && word.indexOf(FINAL[l] || '\0') < 0; }), 2);
  var tiles = shuffle(word.split('').concat(extra));
  var trow = document.createElement('div'); trow.className = 'tiles';
  var pos = 0;
  tiles.forEach(function (ch) {
    var t = document.createElement('button'); t.className = 'tile'; t.textContent = ch;
    t.onclick = function () {
      if (ch === word.charAt(pos)) {
        t.classList.add('used');
        var sl = slots.children[pos]; sl.textContent = ch; sl.classList.add('filled');
        pos++;
        if (pos === word.length) {
          if (firstTry) { roundScore++; recordItem(q, true); } else recordItem(q, false);
          praise(); setTimeout(nextQ, 1300);
        }
      } else {
        t.classList.add('wrong'); firstTry = false;
        markBtn(t, '❌', 'bad');
        sayTryAgain();
        setTimeout(function () { t.classList.remove('wrong'); var m = t.querySelector('.fbmark'); if (m) m.remove(); }, 900);
      }
    };
    trow.appendChild(t);
  });
  body.appendChild(trow);
}
function nextQ() {
  roundIdx++;
  if (roundIdx >= round.length) { finishRound(); return; }
  renderQ();
}
function finishRound() {
  var total = round.length, score = roundScore;
  markDay();
  var stars = score >= total ? '⭐⭐⭐' : score >= total - 2 ? '⭐⭐' : score >= Math.ceil(total / 2) ? '⭐' : '🌱';
  var msg = score >= total ? (DATA.PAGES[roundPage].math ? 'מושלם! את אלופה בחשבון! 🏆' : 'מושלם! את קוראת נהדר!') : score >= total - 2 ? 'כל הכבוד! כמעט הכול נכון!' : score >= Math.ceil(total / 2) ? 'יופי! ממשיכים להתאמן!' : 'עבודה יפה! נסי שוב ותצליחי יותר!';
  var coinMsg = '';
  if (!roundReview && score >= Math.ceil(total * 0.75)) {
    var st = prog.pages[DATA.PAGES[roundPage].id] || {};
    if (!st.mastered) { st.mastered = 1; addCoins(10, 'סיימתי שיעור: ' + DATA.PAGES[roundPage].title); coinMsg = '🪙 +10 מטבעות לבנק!'; }
    st.best = Math.max(st.best || 0, score); st.wk = weekKey(); prog.pages[DATA.PAGES[roundPage].id] = st;
  } else if (roundReview && score >= Math.ceil(total * 0.75)) {
    var key = 'rev|' + todayKey();
    if (!prog.pages[key]) { prog.pages[key] = {best: score}; addCoins(5, 'סבב חזרה מוצלח'); coinMsg = '🪙 +5 מטבעות לבנק!'; }
  } else if (!roundReview) {
    var st2 = prog.pages[DATA.PAGES[roundPage].id] || {};
    st2.best = Math.max(st2.best || 0, score); prog.pages[DATA.PAGES[roundPage].id] = st2;
  }
  save();
  el('endStars').textContent = stars;
  el('endMsg').textContent = msg + ' (' + score + ' מתוך ' + total + ')';
  el('endCoins').textContent = coinMsg;
  el('endCeleb').innerHTML = celebrateNew();
  speak(score >= 6 ? 'praise|0' : 'praise|3');
  show('screen-end');
}

/* ================= parent gate (STAGE 0 safety, 9/11/2026) =================
   The parent screen — including the 50-coin reward "אישור ומימוש" button —
   opens ONLY after a grown-up passes this gate. No login, no network.
   Gate: a random two-digit + two-digit addition question (numbers re-drawn
   every time, so the answer cannot be memorised). Grade-1 maths covers
   numbers to 20, so a two-digit sum with carry is out of reach for a
   6-year-old. The flag is session-only (a plain var, never stored), so the
   gate must be passed again after every page load. */
var parentUnlocked = false;
function askParentGate() {
  var a = 20 + Math.floor(Math.random() * 60); // 20..79
  var b = 20 + Math.floor(Math.random() * 60);
  var ans = prompt('🔒 מסך הורים — שאלת מבוגרים בלבד:\nכמה זה ' + a + ' + ' + b + '?');
  if (ans !== null && parseInt(ans, 10) === a + b) { parentUnlocked = true; renderParent(); }
}

/* ================= parent ================= */
function renderParent() {
  if (!parentUnlocked) return; // never render the parent screen without passing the gate
  var body = el('parentBody');
  var html = '';
  ['א','ב','ג'].forEach(function (bk) {
    var pages = DATA.PAGES.filter(function (p) { return p.booklet === bk; });
    var done = pages.filter(function (p) { return (prog.pages[p.id] || {}).mastered; }).length;
    html += '<h3>חוברת ' + bk + '׳ — ' + done + '/' + pages.length + ' שיעורים הושלמו</h3><div class="bar"><div style="width:' + (pages.length ? done / pages.length * 100 : 0) + '%"></div></div>';
  });
  var foc = currentFocus();
  html += '<h3>🌟 לומדים עכשיו בכיתה — בחירת הורה</h3><p class="note">בחרי שיעורים למיקוד — הם יופיעו בראש הטאב המתאים בדף הבית.</p>';
  [['א', 'צלילים מספרים 1'], ['ב', 'צלילים מספרים 2'], ['ג', 'חוברת 3'], ['M', 'חשבון']].forEach(function (g) {
    var bk = g[0];
    var list = DATA.PAGES.filter(function (p) { return p.booklet === bk; });
    var tab = bk === 'M' ? 'math' : 'he';
    var picked = tab === 'he' ? foc.he : foc.math;
    html += '<div><b>' + g[1] + ':</b><br>';
    list.forEach(function (p) {
      var label = p.math ? p.title : (p.page ? 'שיעור ' + p.page + ' — ' + p.title : p.title);
      html += '<label style="display:inline-block;margin:3px 8px 3px 0"><input type="checkbox" data-focus="' + tab + '" value="' + p.id + '"' + (picked.indexOf(p.id) >= 0 ? ' checked' : '') + '> ' + label + '</label>';
    });
    html += '</div>';
  });
  html += '<p><button class="btn-primary" id="focusSave">💾 שמירת מיקוד</button> <button class="btn-ghost" id="focusReset">↩ ברירת מחדל</button> <span id="focusMsg"></span></p>';
  var weak = Object.keys(prog.items).filter(function (k) { return prog.items[k].wrong >= 2; }).sort(function (a, b) { return prog.items[b].wrong - prog.items[a].wrong; }).slice(0, 8);
  html += '<h3>כדאי לחזק</h3>';
  html += weak.length ? '<p>' + weak.map(function (k) { return k.replace('L:', 'האות ').replace('W:', 'המילה ').replace('Y:', 'ההברה ') + ' (' + prog.items[k].wrong + ' טעויות)'; }).join('<br>') + '</p>' : '<p>אין פריטים חלשים כרגע 🌟</p>';
  html += '<h3>בנק הידע — ' + prog.bank + ' 🪙</h3>';
  if (prog.requests.length) {
    html += '<p><b>בקשות לצ׳ופר:</b></p>' + prog.requests.map(function (r, i) { return '<p>' + r.name + ' — 50 🪙 <button class="btn-danger" data-approve="' + i + '">אישור ומימוש</button></p>'; }).join('');
  }
  html += '<table class="ptable"><tr><th>תאריך</th><th>שינוי</th><th>סיבה</th></tr>' + prog.log.slice(0, 15).map(function (l) { return '<tr><td>' + l.d + '</td><td>' + (l.n > 0 ? '+' : '') + l.n + '</td><td>' + l.why + '</td></tr>'; }).join('') + '</table>';
  html += '<p class="note">צ׳ופר = 50 מטבעות, באישור הורה כאן. הבנק רק גדל.</p>';
  body.innerHTML = html;
  Array.prototype.forEach.call(body.querySelectorAll('[data-approve]'), function (b) {
    b.onclick = function () {
      if (!parentUnlocked) return; // STAGE 0: the reward-approve button only works behind the parent gate
      var i = +b.getAttribute('data-approve');
      if (prog.bank >= 50) { addCoins(-50, 'צ׳ופר: ' + prog.requests[i].name); prog.requests.splice(i, 1); save(); renderParent(); renderHome(); }
    };
  });
  el('focusSave').onclick = function () {
    var he = [], math = [];
    Array.prototype.forEach.call(body.querySelectorAll('[data-focus]'), function (cb) {
      if (cb.checked) (cb.getAttribute('data-focus') === 'he' ? he : math).push(cb.value);
    });
    setFocusSelection(he, math);
    el('focusMsg').textContent = 'נשמר ✓';
  };
  el('focusReset').onclick = function () { setFocusSelection([], []); renderParent(); };
  show('screen-parent');
}

/* ================= wiring ================= */
el('learnBack').onclick = renderHome;
el('quizBack').onclick = function () { seqToken++; try { if (curAudio) curAudio.pause(); } catch (e) {} renderHome(); };
el('parentBack').onclick = renderHome;
el('btnParent').onclick = askParentGate; // STAGE 0: parent screen behind the grown-ups gate (was: renderParent directly)
el('learnStart').onclick = function () { startRound(curPage, false); };
el('btnReview').onclick = function () { navStopReadAll(); var my = ++navTapSeq; navSay('חזרה על הכל', function () { if (my !== navTapSeq) return; startRound(DATA.PAGES.length - 1, true); }); };
el('btnContinue').onclick = function () { navStopReadAll(); var my = ++navTapSeq; var idx = continueTargetIdx(); navSay(navPageLabel(DATA.PAGES[idx]), function () { if (my !== navTapSeq) return; openLearn(idx); }); };
el('tabHe').onclick = function () { navStopReadAll(); navSay('עברית'); setTab('he'); };
el('tabMath').onclick = function () { navStopReadAll(); navSay('חשבון'); setTab('math'); };
el('tabEng').onclick = function () { navStopReadAll(); navSay('אנגלית'); setTab('eng'); };
el('endAgain').onclick = function () { startRound(roundPage, roundReview); };
el('btnNavSay').onclick = navReadAll;
el('endHome').onclick = renderHome;
el('btnGoal').onclick = function () {
  var opts = [2, 3, 4, 5];
  var cur = prog.goalPages;
  var nxt = opts[(opts.indexOf(cur) + 1) % opts.length] || 3;
  prog.goalPages = nxt; save(); renderHome();
  alert('היעד השבועי: ' + nxt + ' שיעורים (לחיצה שוב משנה)');
};
renderHome();
</script>
<script id="g1-fun-js">
/* G1-FUN — פיצוץ אימוג׳ים כשעונים נכון / משלימים מילה / מסיימים סבב.
   מאזין לשינויים במסך בלבד, לא משנה את המנוע. כל כשל משאיר את האתר כמו שהיה. */
(function(){
  'use strict';
  try{
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    var SETS=[['⭐','✨','🌟','💖','🎉'],['🌸','✨','💜','⭐','🦋'],['🎈','⭐','✨','🍭','🌈']];
    function burst(el,n){
      try{
        var r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,set=SETS[(Math.random()*SETS.length)|0];
        for(var i=0;i<n;i++){
          var d=document.createElement('div'),a=(Math.PI*2*i/n)+Math.random()*.5,dist=70+Math.random()*60;
          d.className='g1-p';d.textContent=set[i%set.length];
          d.style.left=x+'px';d.style.top=y+'px';
          d.style.setProperty('--dx',Math.round(Math.cos(a)*dist)+'px');
          d.style.setProperty('--dy',Math.round(Math.sin(a)*dist-30)+'px');
          d.style.setProperty('--r',Math.round(Math.random()*120-60)+'deg');
          document.body.appendChild(d);
          (function(el2){setTimeout(function(){el2.remove();},1000);})(d);
        }
      }catch(e){}
    }
    var quiz=document.getElementById('screen-quiz'),end=document.getElementById('screen-end');
    if(quiz&&window.MutationObserver){
      new MutationObserver(function(ms){
        for(var i=0;i<ms.length;i++){
          var t=ms[i].target;
          if(ms[i].type!=='attributes'||!t.classList)continue;
          if(t.classList.contains('opt')&&t.classList.contains('right')&&!t._g1){t._g1=1;burst(t,10);}
          else if(t.classList.contains('slot')&&t.classList.contains('filled')&&!t._g1){
            t._g1=1;var all=t.parentNode&&t.parentNode.children,done=true;
            if(all)for(var k=0;k<all.length;k++)if(!all[k].classList.contains('filled'))done=false;
            if(done)burst(t.parentNode,12);
          }
        }
      }).observe(quiz,{subtree:true,attributes:true,attributeFilter:['class']});
    }
    if(end&&window.MutationObserver){
      new MutationObserver(function(){
        if(!end.classList.contains('hidden')){var st=document.getElementById('endStars');
          if(st&&/⭐/.test(st.textContent))setTimeout(function(){burst(st,16);},350);}
      }).observe(end,{attributes:true,attributeFilter:['class']});
    }
  }catch(e){}
})();
</script>

<script id="persist-storage">
/* מבקש מהדפדפן אחסון קבוע, כדי שההתקדמות לא תימחק כשהמכשיר מפנה מקום (11/11/2026). */
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});}catch(e){}
</script>
<script id="g1-tts-js">
/* G1-TTS — ההקראה בכיתה א׳ אומרת רק מה שהילדה צריכה (13/11/2026):
   בלי "עמוד 12" ובלי "חוברת א/ב" — רק שם השיעור. מה שכתוב על המסך לא משתנה.
   להסרה: למחוק את הבלוק הזה. */
try{(function(){
  var strip=function(t){return String(t==null?'':t).replace(/עמוד\s*\d+\s*[,،:—–-]?\s*/g,'').replace(/^\s*חוברת\s+[אב]['׳]?\s*$/,'').trim()};
  window.navPageLabel=function(pg){return pg&&pg.title?pg.title:''};
  if(typeof window.navSay==='function'){var say=window.navSay;window.navSay=function(text,done){var t=strip(text);if(!t){if(done)done();return}return say.call(this,t,done)}}
  if(typeof window.visibleNavLabels==='function'){var vis=window.visibleNavLabels;window.visibleNavLabels=function(){return vis.apply(this,arguments).map(strip).filter(Boolean)}}
})()}catch(e){}
</script>
<script id="g1-books-js">
/* G1-BOOKS — שיעורי חיריק וחולם לפי "צלילים מספרים 2" (14/11/2026):
   בכל יחידה לפחות 5 מתוך 8 שאלות הן על האותיות של היחידה עם התנועה החדשה (שומעים הברה ובוחרים).
   להסרה: למחוק את הבלוק הזה (השיעורים עדיין יעבדו, רק פחות ממוקדים). */
try{(function(){
  /* "ממשיכים" = השיעור הראשון בספר (חוברת 1, אחר כך 2) שעוד לא הושלם */
  if(typeof window.continueTargetIdx==='function'){window.continueTargetIdx=function(){
    for(var i=0;i<DATA.PAGES.length;i++){var p=DATA.PAGES[i];if((p.booklet==='א'||p.booklet==='ב')&&!((prog.pages[p.id]||{}).mastered))return i}
    for(i=0;i<DATA.PAGES.length;i++){if(!((prog.pages[DATA.PAGES[i].id]||{}).mastered))return i}
    return 0};
    try{if(typeof renderHome==='function'&&!document.getElementById('screen-home').classList.contains('hidden'))renderHome()}catch(e){}}
  var orig=window.genQuestions;if(typeof orig!=='function')return;
  window.genQuestions=function(idx,review){
    var qs=orig.apply(this,arguments);
    try{
      var pg=DATA.PAGES[idx];if(review||!pg||pg.kind!=='vowel'||!pg.vowels||!/^(i|o)$/.test(pg.vowels[0]))return qs;
      var v=pg.vowels[0],known=cumLetters(idx),focus=(pg.focus&&pg.focus.length)?pg.focus:known;
      var rnd=function(a){return a[Math.floor(Math.random()*a.length)]};
      var sylQ=function(){var L=rnd(focus),tgt=syllable(L,v),seen={},opts=[tgt];seen[tgt]=1;
        var c=[syllable(L,'a'),syllable(L,'shva')].concat(focus.filter(function(x){return x!==L}).map(function(x){return syllable(x,v)}),shuffle(known).slice(0,4).map(function(x){return syllable(x,v)}));
        shuffle(c).forEach(function(x){if(opts.length<4&&!seen[x]){seen[x]=1;opts.push(x)}});
        return {type:'syl',inst:'inst|syl',audio:tgt,promptHtml:'<span class="spk" aria-hidden="true">🔊</span>',options:shuffle(opts),correct:tgt,optClass:'small',itemKey:'Y:'+tgt}};
      var sndQ=function(){var L=rnd(focus),pool=known.filter(function(x){return x!==L});
        return {type:'snd',inst:'inst|snd',audio:syllable(L,v),promptHtml:'<span class="spk" aria-hidden="true">🔊</span>',options:shuffle([L].concat(shuffle(pool).slice(0,3))),correct:L,itemKey:'L:'+L}};
      var focused=[sylQ(),sylQ(),sylQ(),sndQ(),sndQ()];
      return shuffle(focused.concat(qs.slice(0,3)));
    }catch(e){return qs}
  };
})()}catch(e){}
</script>
