<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הבנת הנקרא — קוראים, מבינים וכותבים</title>
<link rel="icon" href="../favicon.png">
<link id="kit-theme" rel="stylesheet" href="../shared/kit-theme.css">
<style>
:root{--c:#D9480F;--bg:#FAF6EB;--ink:#1E4634;--soft:#4F6B5D;--line:#D8E4D4;--ok:#2B8A3E;--mid:#E67700;--bad:#C92A2A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,system-ui,sans-serif;font-size:18px;line-height:1.6;-webkit-text-size-adjust:100%}
main{max-width:760px;margin:0 auto;padding:0 16px 48px}
.card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 22%,#D8E4D4)}
h2{font-size:22px;margin:4px 0 8px}
h3{font-size:19px;margin:0 0 6px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;min-height:54px;border:0;border-radius:18px;background:var(--c);color:#fff;font-size:20px;font-weight:800;padding:10px 16px;
  box-shadow:0 5px 0 color-mix(in srgb,var(--c) 62%,#000);margin-top:12px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 62%,#000)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-size:17px;font-weight:700;min-height:48px}
.btn[disabled]{opacity:.45}
.btn:focus-visible,.lv:focus-visible,.pc:focus-visible,.sent:focus-visible{outline:3px solid #F59E0B;outline-offset:2px}
/* שלבים */
.lvrow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{min-height:58px;border-radius:16px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:20px;display:grid;place-items:center;line-height:1.1;padding:4px}
.lv small{display:block;font-size:11px;font-weight:700;color:var(--soft)}
.lv.on{background:var(--c);color:#fff;border-color:var(--c)}.lv.on small{color:#fff}
.lv.done{background:#EBFBEE;border-color:#8CE99A}
.lv.lock{opacity:.5}
.pc{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin:10px 0;
  box-shadow:0 4px 0 color-mix(in srgb,var(--c) 22%,#D8E4D4);min-height:64px}
.pc .em{font-size:30px}.pc b{display:block;font-size:19px}.pc small{color:var(--soft);font-size:14px}
.pc .st{margin-inline-start:auto;font-size:18px;white-space:nowrap}
/* קטע */
.psg{font-size:19px;line-height:1.9}
.psg p{margin:0 0 12px}
.psg.pick .sent{border-radius:8px;background:#FFF4E6;cursor:pointer;padding:2px 0;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sent.good{background:#D3F9D8!important}.sent.wrong{background:#FFE3E3!important}.sent.say{background:#FFF3BF}
.pill{display:inline-block;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:800}
.voc{margin:8px 0 0;padding:0;list-style:none}.voc li{padding:6px 0;border-bottom:1px dashed var(--line)}.voc li:last-child{border:0}
.steps{display:flex;gap:6px;margin:6px 0 2px}.steps i{flex:1;height:8px;border-radius:8px;background:var(--line)}.steps i.on{background:var(--c)}
.qtxt{font-size:20px;font-weight:800;margin:6px 0 10px}
.starter{font-weight:700;color:var(--c);margin-bottom:4px}
textarea{width:100%;min-height:96px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;font-size:19px;line-height:1.6;color:var(--ink);background:#FFFDF7;resize:vertical}
textarea:focus{outline:3px solid #F59E0B;outline-offset:1px}
.help{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}.help span{background:#F1F3F5;border-radius:999px;padding:2px 10px;font-size:15px}
.fb{border-radius:14px;padding:10px 12px;margin-top:12px;font-weight:700}
.fb.ok{background:#EBFBEE;color:var(--ok)}.fb.mid{background:#FFF4E6;color:var(--mid)}.fb.bad{background:#FFF5F5;color:var(--bad)}
.fb small{display:block;font-weight:600;color:var(--ink);margin-top:4px;font-size:16px}
.model{background:#F8F9FA;border-radius:14px;padding:10px 12px;margin-top:10px;font-size:17px}.model b{display:block;font-size:14px;color:var(--soft)}
.row{display:flex;gap:8px}.row .btn{flex:1}
.tog{background:none;border:0;color:var(--c);font-weight:800;padding:8px 0;font-size:17px}
.center{text-align:center}.big{font-size:54px;line-height:1.1}
.plink{display:block;margin:26px auto 0;background:none;border:0;color:var(--soft);font-size:14px;text-decoration:underline}
.pa{border-top:1px dashed var(--line);padding:8px 0;font-size:16px}.pa b{display:block}
.cb{display:flex;align-items:center;gap:8px;max-width:728px;margin:0 auto 4px;padding:8px 14px;border-radius:14px;font-size:15px;font-weight:700;text-decoration:none;box-sizing:border-box}
@media (max-width:760px){.cb{margin:0 16px 4px}}
.cb.ok{background:#EBFBEE;color:#2B8A3E}.cb.warn{background:#FFF4E6;color:#D9480F}.cb.off{background:#F1F3F5;color:#495057}
.cb small{font-weight:600;margin-inline-start:auto;text-decoration:underline}
main.wide~.cb,.cb:has(+main.wide){max-width:1148px}
.tabs{display:flex;gap:8px;margin:12px 0 0}.tabs button{flex:1;min-height:52px;border-radius:16px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:17px}
.tabs button.on{background:var(--c);color:#fff;border-color:var(--c)}
.rank{display:flex;align-items:center;gap:12px}.rank .em{font-size:40px}.bar{height:10px;border-radius:10px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--c)}
.tpl{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;font-size:14px}.tpl span{background:#FFF4E6;border-radius:999px;padding:2px 10px;font-weight:700}
.kbs{display:flex;gap:8px;align-items:flex-start;margin-top:10px}.kbs b{flex:0 0 46px;padding-top:12px;color:var(--c);font-size:19px}.kbs textarea{min-height:64px}
.said{background:#F1F3F5;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:17px}.said b{display:block;font-size:13px;color:var(--soft)}
.fix{background:#FFF9DB;border-radius:14px;padding:10px 12px;margin-top:12px}.fix .fr{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}.fix s{color:var(--bad)}
.fix input,.flash input{font:inherit;font-size:19px;border:2px solid var(--line);border-radius:12px;padding:6px 10px;width:150px;background:#fff;color:var(--ink)}
.fix input.ok,.flash input.ok{border-color:var(--ok);background:#EBFBEE}
.flash{text-align:center}.flash .w{font-size:40px;font-weight:900;min-height:64px;letter-spacing:1px}
.msg{background:#E7F5FF;border-radius:14px;padding:10px 12px;margin:8px 0;font-size:17px}.msg b{display:block;font-size:13px;color:#1864AB}
.reply{min-height:64px;font-size:16px;margin-top:8px}
.savebar{margin-top:14px;text-align:center}.savebar .btn{margin-top:0;font-size:16px;min-height:44px}
.autosaved{color:var(--soft);font-size:13px;margin-top:6px}
.card.resume{border-color:#F59E0B!important;background:#FFF9DB!important}
[hidden]{display:none!important}
/* מחשב (מסך רחב): הקטע והכתיבה זה לצד זה, כדי שהקטע יהיה מול העיניים בזמן הכתיבה. בטלפון הכול נשאר בעמודה אחת. */
@media (min-width:900px){
  main.wide{max-width:1180px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .cols>.pcard{order:-1;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
  .cols #tg{display:none}.cols #pg{display:block!important}
  .cols textarea#ans{min-height:170px}.cols .kbs textarea{min-height:84px}
  .kbd{display:block!important;color:var(--soft);font-size:14px;text-align:center;margin-top:8px}
}
.kbd{display:none}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>

<div class="kit-hero" role="banner" style="--c:#D9480F"><span class="kh-pal" aria-hidden="true">📖</span><div class="kh-t"><div class="kh-title">הבנת הנקרא בכתיבה</div><div class="kh-sub">קוראים ועונים במילים שלכם</div></div><a class="kh-home" id="homeLink" href="../" aria-label="חזרה">🏠</a></div>

<script id="reading-data">
/* קטעי הקריאה — כולם מקוריים (נכתבו לאתר, לא הועתקו מספרי לימוד).
   מבנה קטע: id, lvl, kind, em, title, pre (שאלה לפני הקריאה), voc [[מילה, פירוש]], text (פסקאות),
   loc {q, find}  — "איפה כתוב?": find = רצף מילים ייחודי מתוך המשפט הנכון,
   qs [{q, st (פתיחת משפט), ideas [{k:[שורשים/מילים שמעידים שהרעיון נמצא], h: רמז}], model, op (שאלת דעה)}] */
var LEVELS = [
  {n:1, name:'משלימים משפט', min:2},
  {n:2, name:'משלימים ומנמקים', min:3},
  {n:3, name:'משפט שלם עם מילות עזר', min:5},
  {n:4, name:'משפט שלם לבד', min:6},
  {n:5, name:'שני משפטים', min:10},
  {n:6, name:'תשובה עם הוכחה', min:14},
  {n:7, name:'מסיקים מסקנות', min:18},
  {n:8, name:'פסקה: טענה והוכחה', min:25},
  {n:9, name:'פסקת דעה', min:32},
  {n:10, name:'סיכום ודעה', min:40}
];
var PASSAGES = [
{id:'p01', lvl:1, kind:'קטע מידע', em:'🐕', title:'הכלב שחיכה בתחנה',
 pre:'כמה זמן, לדעתכם, כלב יכול לחכות למישהו שהוא אוהב?',
 voc:[['נאמן','מי שנשאר לצידך תמיד ולא עוזב'],['ליווה','הלך יחד עם מישהו'],['פסל','דמות עשויה אבן או מתכת']],
 text:["לפני כמאה שנה חי ביפן כלב בשם האצ'יקו. בכל בוקר הוא ליווה את בעליו, פרופסור באוניברסיטה, אל תחנת הרכבת. בכל ערב הוא חזר לתחנה וחיכה לו ליד השער.",
  "יום אחד הפרופסור חלה בזמן העבודה ומת. הוא לא חזר ברכבת. האצ'יקו לא הבין מה קרה. הוא המשיך להגיע לתחנה בכל ערב, בדיוק בשעה שבה הרכבת הייתה מגיעה, וחיכה.",
  "כך עשה האצ'יקו במשך כמעט עשר שנים. אנשים שעברו בתחנה התרגלו אליו. הם הביאו לו אוכל ומים, ועיתון אחד כתב עליו כתבה. בזכותה כל יפן שמעה על הכלב הנאמן.",
  "היום עומד ליד התחנה פסל של האצ'יקו. אנשים רבים קובעים להיפגש דווקא לידו."],
 loc:{q:"במשך כמה זמן חיכה האצ'יקו בתחנה?", find:'כמעט עשר שנים'},
 qs:[
  {q:'למה הפרופסור לא חזר ברכבת?', st:'הפרופסור לא חזר ברכבת כי', ideas:[{k:['חלה','מת','נפטר','חולה'],h:'קראו שוב את תחילת הפסקה השנייה.'}], model:'הפרופסור לא חזר ברכבת כי הוא חלה בזמן העבודה ומת.'},
  {q:"איך כל יפן שמעה על האצ'יקו?", st:"כל יפן שמעה על האצ'יקו בזכות", ideas:[{k:['עיתון','עתון','כתבה'],h:'חפשו בפסקה השלישית: מי כתב עליו?'}], model:"כל יפן שמעה על האצ'יקו בזכות כתבה שהתפרסמה עליו בעיתון."},
  {q:"למה קוראים להאצ'יקו \"הכלב הנאמן\"?", st:'קוראים לו הכלב הנאמן כי', ideas:[{k:['חיכ','המשיך','חזר','הגיע','בא '],h:'מה הוא עשה בכל ערב?'},{k:['שנים','שנה','כל ערב','כל יום','מת','אחרי ש','למרות'],h:'כמה זמן זה נמשך, וזה קרה גם אחרי מה?'}], model:'קוראים לו הכלב הנאמן כי הוא המשיך לחכות לבעליו בתחנה בכל ערב במשך כמעט עשר שנים, גם אחרי שבעליו מת.'}
 ]},
{id:'p02', lvl:1, kind:'קטע מידע', em:'🥱', title:'למה אנחנו מפהקים?',
 pre:'מתי פיהקתם בפעם האחרונה? נסו לקרוא את הקטע בלי לפהק.',
 voc:[['חמצן','הגז שבאוויר שאנחנו צריכים כדי לנשום'],['מדבק','עובר מאדם לאדם'],['חוקרים','אנשים שבודקים דברים כדי לגלות ידע חדש']],
 text:["כולנו מפהקים: כשאנחנו עייפים, כשמשעמם לנו, ולפעמים סתם באמצע היום. אבל למה הגוף עושה את זה?",
  "במשך שנים חשבו שפיהוק מכניס לגוף עוד חמצן. היום מדענים רבים חושבים אחרת. לדעתם הפיהוק מקרר את המוח. כשאנחנו פותחים את הפה ושואפים הרבה אוויר, דם קריר יותר מגיע אל המוח, והוא עובד טוב יותר.",
  "יש עוד דבר מוזר בפיהוק: הוא מדבק. מספיק לראות מישהו מפהק, ואפילו רק לקרוא על פיהוק, כדי להתחיל לפהק בעצמנו. חוקרים גילו שאנחנו נדבקים בעיקר מאנשים שקרובים אלינו, כמו בני משפחה וחברים.",

 loc:{q:'ממי אנחנו נדבקים בפיהוק בעיקר?', find:'שקרובים אלינו'},
 qs:[
  {q:'מה חשבו פעם על הפיהוק?', st:'פעם חשבו שהפיהוק', ideas:[{k:['חמצן'],h:'חפשו בתחילת הפסקה השנייה: מה הפיהוק מכניס לגוף?'}], model:'פעם חשבו שהפיהוק מכניס לגוף עוד חמצן.'},
  {q:'לפי המדענים היום, איך הפיהוק עוזר למוח?', st:'הפיהוק עוזר למוח כי הוא', ideas:[{k:['מקרר','קריר','מתקרר','קירור','מצנן','לקרר'],h:'מה קורה לטמפרטורה של המוח?'}], model:'הפיהוק עוזר למוח כי הוא מקרר אותו, וכך המוח עובד טוב יותר.'},
  {q:'מה פירוש המשפט "הפיהוק מדבק"?', st:'הפיהוק מדבק, כלומר', ideas:[{k:['רוא','מישהו','אחר','קורא'],h:'מה צריך לקרות קודם? את מי רואים?'},{k:['גם אנחנו','גם אני','בעצמ','מתחיל','נדבק','גם הוא','גם מפהק'],h:'ומה קורה לנו אחרי זה?'}], model:'הפיהוק מדבק, כלומר כשרואים מישהו אחר מפהק מתחילים לפהק בעצמנו.'}

{id:'p03', lvl:1, kind:'מודעה', em:'⚽', title:'טורניר הכדורגל של השכונה',

 text:["טורניר הכדורגל של השכונה חוזר!",
  "ביום שישי, 14 במאי, יתקיים במגרש שליד המתנ\"ס טורניר כדורגל לילדי כיתות ד' עד ו'. המשחקים יתחילו בשעה 15:00 ויסתיימו בשעה 18:00.",
  "איך נרשמים? מרכיבים קבוצה של חמישה שחקנים ושוער, בוחרים לה שם, ונרשמים אצל רונית במזכירות המתנ\"ס עד יום שלישי. ההרשמה בחינם.",
  "חשוב לדעת: כל שחקן צריך להביא בקבוק מים וכובע. מי שיגיע בלי נעלי ספורט לא יוכל לשחק. אם ירד גשם, הטורניר יידחה בשבוע.",
  "הקבוצה המנצחת תקבל גביע, וכל המשתתפים יקבלו ארטיק. גם מי שלא משחק מוזמן לבוא ולעודד!"],
 loc:{q:'עד מתי אפשר להירשם לטורניר?', find:'עד יום שלישי'},
 qs:[
  {q:'מה יקרה אם ירד גשם?', st:'אם ירד גשם,', ideas:[{k:['יידחה','ידחה','נדחה','דחו','שבוע','יעבור','מאוחר'],h:'חפשו את המילה "גשם" בקטע וקראו את המשפט.'}], model:'אם ירד גשם, הטורניר יידחה בשבוע.'},
  {q:'מי לא יוכל לשחק בטורניר?', st:'לא יוכל לשחק מי ש', ideas:[{k:['נעל'],h:'חפשו בפסקה שמתחילה במילים "חשוב לדעת".'}], model:'לא יוכל לשחק מי שיגיע בלי נעלי ספורט.'},
  {q:'כמה ילדים יש בכל קבוצה? הסבירו איך חישבתם.', st:'בכל קבוצה יש', ideas:[{k:['שש','שיש','6'],h:'חברו את כל מי שנמצא בקבוצה.'},{k:['חמיש','5','שוער','ועוד'],h:'כתבו גם ממי מורכבת הקבוצה.'}], model:'בכל קבוצה יש שישה ילדים, כי יש בה חמישה שחקנים ועוד שוער.'}
 ]},
{id:'p04', lvl:1, kind:'סיפור', em:'🔑', title:'המפתח',
 pre:'קרה לכם פעם שנשארתם מחוץ לבית בלי מפתח? מה עשיתם?',
