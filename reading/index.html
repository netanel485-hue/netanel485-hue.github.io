<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הבנת הנקרא — קוראים, מבינים וכותבים</title>
<link rel="icon" href="../favicon.png">
<link id="kit-theme" rel="stylesheet" href="../shared/kit-theme.css">
<style>
:root{--c:#D9480F;--bg:#FAF6EB;--ink:#1E4634;--soft:#4F6B5D;--line:#D8E4D4;--ok:#2B8A3E;--mid:#E67700;--bad:#C92A2A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,system-ui,sans-serif;font-size:18px;line-height:1.6;-webkit-text-size-adjust:100%}
main{max-width:760px;margin:0 auto;padding:0 16px 48px}
.card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 22%,#D8E4D4)}
h2{font-size:22px;margin:4px 0 8px}
h3{font-size:19px;margin:0 0 6px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;min-height:54px;border:0;border-radius:18px;background:var(--c);color:#fff;font-size:20px;font-weight:800;padding:10px 16px;
  box-shadow:0 5px 0 color-mix(in srgb,var(--c) 62%,#000);margin-top:12px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 62%,#000)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-size:17px;font-weight:700;min-height:48px}
.btn[disabled]{opacity:.45}
.btn:focus-visible,.lv:focus-visible,.pc:focus-visible,.sent:focus-visible{outline:3px solid #F59E0B;outline-offset:2px}
/* שלבים */
.lvrow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{min-height:58px;border-radius:16px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:20px;display:grid;place-items:center;line-height:1.1;padding:4px}
.lv small{display:block;font-size:11px;font-weight:700;color:var(--soft)}
.lv.on{background:var(--c);color:#fff;border-color:var(--c)}.lv.on small{color:#fff}
.lv.done{background:#EBFBEE;border-color:#8CE99A}
.lv.lock{opacity:.5}
.pc{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin:10px 0;
  box-shadow:0 4px 0 color-mix(in srgb,var(--c) 22%,#D8E4D4);min-height:64px}
.pc .em{font-size:30px}.pc b{display:block;font-size:19px}.pc small{color:var(--soft);font-size:14px}
.pc .st{margin-inline-start:auto;font-size:18px;white-space:nowrap}
/* קטע */
.psg{font-size:19px;line-height:1.9}
.psg p{margin:0 0 12px}
.psg.pick .sent{border-radius:8px;background:#FFF4E6;cursor:pointer;padding:2px 0;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sent.good{background:#D3F9D8!important}.sent.wrong{background:#FFE3E3!important}.sent.say{background:#FFF3BF}
.pill{display:inline-block;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:800}
.voc{margin:8px 0 0;padding:0;list-style:none}.voc li{padding:6px 0;border-bottom:1px dashed var(--line)}.voc li:last-child{border:0}
.steps{display:flex;gap:6px;margin:6px 0 2px}.steps i{flex:1;height:8px;border-radius:8px;background:var(--line)}.steps i.on{background:var(--c)}
.qtxt{font-size:20px;font-weight:800;margin:6px 0 10px}
.starter{font-weight:700;color:var(--c);margin-bottom:4px}
textarea{width:100%;min-height:96px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;font-size:19px;line-height:1.6;color:var(--ink);background:#FFFDF7;resize:vertical}
textarea:focus{outline:3px solid #F59E0B;outline-offset:1px}
.help{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}.help span{background:#F1F3F5;border-radius:999px;padding:2px 10px;font-size:15px}
.fb{border-radius:14px;padding:10px 12px;margin-top:12px;font-weight:700}
.fb.ok{background:#EBFBEE;color:var(--ok)}.fb.mid{background:#FFF4E6;color:var(--mid)}.fb.bad{background:#FFF5F5;color:var(--bad)}
.fb small{display:block;font-weight:600;color:var(--ink);margin-top:4px;font-size:16px}
.model{background:#F8F9FA;border-radius:14px;padding:10px 12px;margin-top:10px;font-size:17px}.model b{display:block;font-size:14px;color:var(--soft)}
.row{display:flex;gap:8px}.row .btn{flex:1}
.tog{background:none;border:0;color:var(--c);font-weight:800;padding:8px 0;font-size:17px}
.center{text-align:center}.big{font-size:54px;line-height:1.1}
.plink{display:block;margin:26px auto 0;background:none;border:0;color:var(--soft);font-size:14px;text-decoration:underline}
.pa{border-top:1px dashed var(--line);padding:8px 0;font-size:16px}.pa b{display:block}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>

var PASSAGES = [
{id:'p01', lvl:1, kind:'קטע מידע', em:'🐕', title:'הכלב שחיכה בתחנה',

 text:["לפני כמאה שנה חי ביפן כלב בשם האצ'יקו. בכל בוקר הוא ליווה את בעליו, פרופסור באוניברסיטה, אל תחנת הרכבת. בכל ערב הוא חזר לתחנה וחיכה לו ליד השער.",

{id:'p05', lvl:1, kind:'קטע מידע', em:'🐝', title:'בלי דבורים אין תפוחים',

  {q:'למה תמר חזרה אל מיכל?', st:'תמר חזרה אל מיכל כי', ideas:[{k:['הכיר','הרגש','יודעת','ידעה','הבינה','לבד','עצוב','ריחמ','אחרונה','קרה לה','גם היא','מרגיש'],h:'מה תמר ידעה על ההרגשה של מיכל, ומאיפה?'}], model:'תמר חזרה אל מיכל כי היא הכירה את ההרגשה של מי שנשאר אחרון ולבד, ולא רצתה שמיכל תרגיש כך.'},
  {q:'למה, לדעתכם, תמר לא חשבה על התוצאה בדרך הביתה?', st:'לדעתי תמר לא חשבה על התוצאה כי', op:true, model:'אין כאן תשובה אחת נכונה. למשל: לדעתי תמר לא חשבה על התוצאה כי היא הייתה שמחה שעזרה למיכל ושיש לה חברה חדשה, וזה היה חשוב לה יותר מהניצחון.'}
 ]}
];
</script>

<script id="reading-engine">
(function(){
'use strict';
var KEY='reading-v1', app=document.getElementById('app');
var S=load(), cur=null, tts={tok:0,a:null};
try{ if(/grade4-learning/.test(document.referrer)) sessionStorage.setItem('reading-back','../grade4-learning/');
     else if(/grade6-learning/.test(document.referrer)) sessionStorage.setItem('reading-back','../grade6-learning/');
     var bk=sessionStorage.getItem('reading-back'); if(bk) document.getElementById('homeLink').href=bk; }catch(e){}

function load(){ try{ var o=JSON.parse(localStorage.getItem(KEY)||'{}'); if(!o.done) o.done={}; return o; }catch(e){ return {done:{}}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function norm(s){ return String(s).replace(/[֑-ׇ]/g,'').replace(/[ךםןףץ]/g,function(c){return {'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'}[c];})
  .replace(/[^א-ת0-9a-zA-Z ]+/g,' ').replace(/\s+/g,' ').trim(); }
function words(s){ var n=norm(s); return n?n.split(' ').length:0; }
function byLevel(n){ return PASSAGES.filter(function(p){return p.lvl===n;}); }
function passed(p){ var d=S.done[p.id]; return !!d && d.score/d.max>=0.6; }
function passedIn(n){ return byLevel(n).filter(passed).length; }
function unlocked(n){ return n===1 || passedIn(n-1)>=Math.min(3,byLevel(n-1).length||99); }
function stars(d){ var r=d.score/d.max; return r>=0.9?'⭐⭐⭐':r>=0.75?'⭐⭐':r>=0.6?'⭐':'🔁'; }
function sentences(par){ return par.match(/[^.!?]+[.!?]+["״”]?\s*|[^.!?]+$/g)||[par]; }

/* ---------- בית ---------- */
function home(){
  stopTts(); cur=null;
  var top=1; LEVELS.forEach(function(l){ if(byLevel(l.n).length && unlocked(l.n)) top=l.n; });
  var sel=S.view&&unlocked(S.view)&&byLevel(S.view).length?S.view:top;
  var h='<div class="card"><h2>השלבים</h2><div class="lvrow">';
  LEVELS.forEach(function(l){
    var has=byLevel(l.n).length>0, un=has&&unlocked(l.n), dn=has&&passedIn(l.n)>=Math.min(3,byLevel(l.n).length);
    h+='<button class="lv'+(l.n===sel?' on':dn?' done':'')+(un?'':' lock')+'" data-lv="'+l.n+'"'+(un?'':' disabled')+' aria-label="שלב '+l.n+(un?'':has?' — נעול':' — בקרוב')+'">'+
       (un?l.n:has?'🔒':'🚧')+'<small>'+(un?(dn?'✓':'שלב'):has?'נעול':'בקרוב')+'</small></button>';
  });
  var L=LEVELS[sel-1];
  h+='</div></div><div class="card"><span class="pill">שלב '+sel+'</span><h2>'+esc(L.name)+'</h2>'+
     '<div style="color:var(--soft);font-size:16px">עוברים לשלב הבא אחרי 3 קטעים מוצלחים. הצלחתם: '+passedIn(sel)+' מתוך '+byLevel(sel).length+'</div></div>';
  byLevel(sel).forEach(function(p){ var d=S.done[p.id];
    h+='<button class="pc" data-p="'+p.id+'"><span class="em" aria-hidden="true">'+p.em+'</span><span><b>'+esc(p.title)+'</b><small>'+esc(p.kind)+'</small></span><span class="st">'+(d?stars(d):'▶️')+'</span></button>'; });
  h+='<button class="plink" id="parentBtn">להורים: התשובות שנכתבו</button>';
  app.innerHTML=h; window.scrollTo(0,0);
  each('[data-lv]',function(b){ b.onclick=function(){ S.view=+b.getAttribute('data-lv'); save(); home(); }; });
  each('[data-p]',function(b){ b.onclick=function(){ start(b.getAttribute('data-p')); }; });
  document.getElementById('parentBtn').onclick=parents;
}
function each(sel,fn){ Array.prototype.forEach.call(app.querySelectorAll(sel),fn); }
function stepsBar(i,n){ var h='<div class="steps" aria-hidden="true">'; for(var k=0;k<n;k++) h+='<i'+(k<=i?' class="on"':'')+'></i>'; return h+'</div>'; }

/* ---------- קטע ---------- */
function start(id){
  var p=PASSAGES.filter(function(x){return x.id===id;})[0]; if(!p) return;
  cur={p:p, qi:0, score:0, max:1+p.qs.length*2, ans:[], locTry:0};
  var h=stepsBar(0,3+p.qs.length)+'<div class="card"><span class="pill">'+esc(p.kind)+'</span><h2>'+p.em+' '+esc(p.title)+'</h2>'+
    '<h3>לפני שקוראים, חשבו רגע:</h3><div>'+esc(p.pre)+'</div></div>'+
    '<div class="card"><h3>מילים שכדאי להכיר</h3><ul class="voc">'+p.voc.map(function(v){return '<li><b>'+esc(v[0])+'</b> — '+esc(v[1])+'</li>';}).join('')+'</ul></div>'+
    '<button class="btn" id="go">לקריאה 📖</button><button class="btn ghost" id="back">חזרה לרשימה</button>';
  app.innerHTML=h; window.scrollTo(0,0);
  document.getElementById('go').onclick=read; document.getElementById('back').onclick=home;
}
function psgHtml(p,pick){
  var i=0; return '<div class="psg'+(pick?' pick':'')+'" id="psg">'+p.text.map(function(par){
    return '<p>'+sentences(par).map(function(s){ return '<span class="sent" data-i="'+(i++)+'"'+(pick?' role="button" tabindex="0"':'')+'>'+esc(s)+'</span>'; }).join('')+'</p>'; }).join('')+'</div>';
}
function allSent(p){ var o=[]; p.text.forEach(function(par){ sentences(par).forEach(function(s){o.push(s);}); }); return o; }
function read(){
  var p=cur.p;
  app.innerHTML=stepsBar(1,3+p.qs.length)+'<div class="card"><h2>'+p.em+' '+esc(p.title)+'</h2>'+psgHtml(p,false)+
    '<button class="btn ghost" id="say" hidden>🔊 להקשיב לקטע</button></div><button class="btn" id="go">קראתי, אפשר להמשיך ➜</button>';
  window.scrollTo(0,0);
  var say=document.getElementById('say'); if(navigator.onLine!==false){ say.hidden=false; say.onclick=function(){ toggleTts(p,say); }; }
  document.getElementById('go').onclick=function(){ stopTts(); locate(); };
}
/* ---------- הקראה (הקול של Google Translate, משפט אחרי משפט; עובד רק עם אינטרנט) ---------- */
function stopTts(){ tts.tok++; try{ if(tts.a) tts.a.pause(); }catch(e){} each('.sent.say',function(x){x.classList.remove('say');}); }
function toggleTts(p,btn){
  if(btn.getAttribute('data-on')){ stopTts(); btn.removeAttribute('data-on'); btn.textContent='🔊 להקשיב לקטע'; return; }
  btn.setAttribute('data-on','1'); btn.textContent='⏹ לעצור את ההקראה';
  var list=allSent(p), my=++tts.tok;
  var done=function(){ if(my===tts.tok){ stopTts(); btn.removeAttribute('data-on'); btn.textContent='🔊 להקשיב לקטע'; } };
  var step=function(i){
    if(my!==tts.tok) return; if(i>=list.length) return done();
    each('.sent.say',function(x){x.classList.remove('say');});
    var el=app.querySelector('.sent[data-i="'+i+'"]'); if(el) el.classList.add('say');
    var parts=chunks(list[i]), k=0;
    var next=function(){ if(my!==tts.tok) return; if(k>=parts.length) return step(i+1);
      var a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=he&q='+encodeURIComponent(parts[k++]));
      tts.a=a; a.onended=next; a.onerror=done; var pr=a.play(); if(pr&&pr.catch) pr.catch(done); };
    next();
  };
  step(0);
}
function chunks(s){ s=s.trim(); if(s.length<=180) return [s]; var out=[],c='';
  s.split(' ').forEach(function(w){ if((c+' '+w).length>180&&c){ out.push(c); c=w; } else c=c?c+' '+w:w; }); if(c) out.push(c); return out; }

/* ---------- איפה כתוב? ---------- */
function locate(){
  var p=cur.p, list=allSent(p), target=-1;
  list.forEach(function(s,i){ if(target<0 && s.indexOf(p.loc.find)>=0) target=i; });
  app.innerHTML=stepsBar(2,3+p.qs.length)+'<div class="card"><span class="pill">איפה כתוב?</span><div class="qtxt">'+esc(p.loc.q)+'</div>'+
    '<div style="color:var(--soft);font-size:16px">הקישו על המשפט בקטע שבו נמצאת התשובה.</div><div id="locFb"></div></div>'+
    '<div class="card">'+psgHtml(p,true)+'</div><button class="btn" id="go" hidden>ממשיכים לכתיבה ✍️</button>';
  window.scrollTo(0,0);
  var fb=document.getElementById('locFb'), go=document.getElementById('go'), over=false;
  var finish=function(pts,cls,msg){ over=true; cur.score+=pts; cur.loc=pts; fb.innerHTML='<div class="fb '+cls+'">'+msg+'</div>';
    var t=app.querySelector('.sent[data-i="'+target+'"]'); if(t) t.classList.add('good'); go.hidden=false; go.scrollIntoView({block:'nearest'}); };
  each('.sent',function(el){ var hit=function(){ if(over) return;
      if(+el.getAttribute('data-i')===target){ finish(cur.locTry?0.5:1,'ok',cur.locTry?'✅ נכון! מצאתם בניסיון השני.':'✅ מצוין! מצאתם את המשפט.'); }
      else { cur.locTry++; el.classList.add('wrong');
        if(cur.locTry>=2) finish(0,'mid','🟡 המשפט הנכון מסומן עכשיו בירוק. קראו אותו שוב.');
        else fb.innerHTML='<div class="fb bad">עוד לא. קראו שוב את השאלה ונסו משפט אחר.</div>'; } };
    el.onclick=hit; el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); hit(); } }; });
  go.onclick=function(){ cur.qi=0; write(); };
}

/* ---------- כתיבה ---------- */
function check(q,full,typed,lvl){
  var n=norm(full), need=LEVELS[lvl-1].min, wc=words(typed);
  if(q.op){ return {full:wc>=Math.max(4,need), miss:[], op:true}; }
  var miss=[]; q.ideas.forEach(function(id){ var ok=id.k.some(function(k){ var s=norm(k); return s && (' '+n+' ').indexOf(/ $/.test(k)?s+' ':s)>=0; }); if(!ok) miss.push(id); });
  return {full:miss.length===0, part:miss.length<q.ideas.length, miss:miss};
}
function write(){
  var p=cur.p, q=p.qs[cur.qi], tries=0, lvl=p.lvl, need=LEVELS[lvl-1].min;
  var h=stepsBar(3+cur.qi,3+p.qs.length)+'<div class="card"><span class="pill">שאלה '+(cur.qi+1)+' מתוך '+p.qs.length+(q.op?' · מה דעתכם?':'')+'</span>'+
    '<div class="qtxt">'+esc(q.q)+'</div>'+(q.st?'<div class="starter">'+esc(q.st)+' …</div>':'')+
    '<textarea id="ans" rows="3" aria-label="התשובה שלכם" placeholder="'+(q.st?'המשיכו את המשפט כאן':'כתבו כאן תשובה במשפט שלם')+'"></textarea>'+
    (q.help?'<div class="help">'+q.help.map(function(w){return '<span>'+esc(w)+'</span>';}).join('')+'</div>':'')+
    '<button class="tog" id="mic" hidden>🎤 להגיד בקול במקום להקליד</button>'+
    '<div id="fb"></div><button class="btn" id="chk">בדיקה ✅</button><button class="btn" id="nxt" hidden></button></div>'+
    '<div class="card"><button class="tog" id="tg" aria-expanded="false">📖 להציג את הקטע</button><div id="pg" hidden>'+psgHtml(p,false)+'</div></div>';
  app.innerHTML=h; window.scrollTo(0,0);
  var ta=document.getElementById('ans'), fb=document.getElementById('fb'), chk=document.getElementById('chk'), nxt=document.getElementById('nxt');
  document.getElementById('tg').onclick=function(){ var g=document.getElementById('pg'); g.hidden=!g.hidden; this.textContent=g.hidden?'📖 להציג את הקטע':'📖 להסתיר את הקטע'; this.setAttribute('aria-expanded',String(!g.hidden)); };
  dictation(ta,document.getElementById('mic'));
  nxt.textContent=cur.qi+1<p.qs.length?'לשאלה הבאה ➜':'לסיום 🏁';
  var fullText=function(){ return (q.st?q.st+' ':'')+ta.value.trim(); };
  var close=function(pts,mark){ cur.score+=pts; cur.ans.push({q:q.q,a:fullText(),m:mark,pts:pts}); ta.readOnly=true; chk.hidden=true; nxt.hidden=false;
    fb.insertAdjacentHTML('beforeend','<div class="model"><b>'+(q.op?'דוגמה לתשובה טובה':'תשובה לדוגמה')+'</b>'+esc(q.model)+'</div>');
    if(mark==='part'||mark==='no'){ fb.insertAdjacentHTML('beforeend','<button class="btn ghost" id="self">✋ כתבתי את אותו רעיון במילים אחרות</button>');
      document.getElementById('self').onclick=function(){ var a=cur.ans[cur.ans.length-1], np=a.pts>=1?1.5:1; cur.score+=np-a.pts; a.pts=np; a.m='self'; this.remove();
        fb.insertAdjacentHTML('beforeend','<div class="fb mid">רשמנו. הורה יוכל לקרוא את התשובה ולאשר.</div>'); }; }
    nxt.scrollIntoView({block:'nearest'}); };
  chk.onclick=function(){
    var typed=ta.value.trim();
    if(words(typed)<need){ fb.innerHTML='<div class="fb bad">התשובה קצרה מדי. כתבו לפחות '+need+' מילים'+(q.st?' אחרי פתיחת המשפט':'')+'.</div>'; return; }
    var r=check(q,fullText(),typed,lvl); tries++;
    if(r.full){ fb.innerHTML='<div class="fb ok">'+(r.op?'✅ כתבתם דעה עם הסבר. כל הכבוד!':'✅ תשובה מלאה ונכונה!')+'</div>'; close(tries===1?2:1.5,'full'); return; }
    var hints=r.miss.map(function(m){return m.h;}).join(' ');
    if(tries<2){ fb.innerHTML='<div class="fb '+(r.part?'mid':'bad')+'">'+(r.part?'🟡 התחלה טובה, אבל חסר חלק מהתשובה.':'🔴 עוד לא מצאנו את התשובה במה שכתבתם.')+'<small>רמז: '+esc(hints)+'</small></div>';
      chk.textContent='שיפרתי, לבדוק שוב ✅'; ta.focus(); return; }
    fb.innerHTML='<div class="fb '+(r.part?'mid':'bad')+'">'+(r.part?'🟡 תשובה חלקית.':'🔴 התשובה שכתבתם שונה מהתשובה שבקטע.')+'<small>השוו את מה שכתבתם לתשובה לדוגמה.</small></div>';
    close(r.part?1:0, r.part?'part':'no');
  };
  nxt.onclick=function(){ cur.qi++; if(cur.qi<p.qs.length) write(); else end(); };
}
function dictation(ta,btn){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return;
  btn.hidden=false; var rec=null;
  btn.onclick=function(){
    if(rec){ try{rec.stop();}catch(e){} return; }
    try{ rec=new SR(); rec.lang='he-IL'; rec.interimResults=false;
      rec.onresult=function(e){ var t=''; for(var i=e.resultIndex;i<e.results.length;i++) t+=e.results[i][0].transcript; ta.value=(ta.value?ta.value.trim()+' ':'')+t.trim(); };
      rec.onend=rec.onerror=function(){ rec=null; btn.textContent='🎤 להגיד בקול במקום להקליד'; };
      rec.start(); btn.textContent='⏹ מקשיב… הקישו כדי לעצור'; }catch(e){ rec=null; btn.hidden=true; }
  };
}

/* ---------- סיום ---------- */
function end(){
  var p=cur.p, d={t:Date.now(), score:Math.round(cur.score*10)/10, max:cur.max, loc:cur.loc, ans:cur.ans};
  var old=S.done[p.id]; S.done[p.id]=d; if(old&&old.score/old.max>d.score/d.max) S.done[p.id].best=old.score; save();
  var ok=d.score/d.max>=0.6, before=old&&old.score/old.max>=0.6;
  var nextP=byLevel(p.lvl).filter(function(x){return !S.done[x.id];})[0];
  var lvUp=ok&&!before&&passedIn(p.lvl)===Math.min(3,byLevel(p.lvl).length)&&byLevel(p.lvl+1).length>0;
  var h='<div class="card center"><div class="big">'+(ok?'🎉':'💪')+'</div><h2>'+(ok?'סיימתם את הקטע!':'סיימתם. כדאי לנסות את הקטע שוב.')+'</h2>'+
    '<div style="font-size:30px">'+stars(d)+'</div><div>'+d.score+' נקודות מתוך '+d.max+'</div>'+
    (lvUp?'<div class="fb ok">🔓 נפתח שלב '+(p.lvl+1)+'!</div>':'')+'</div>';
  h+='<div class="card"><h3>מה כתבתם</h3>'+d.ans.map(ansHtml).join('')+'</div>';
  if(lvUp) h+='<button class="btn" id="up">לשלב '+(p.lvl+1)+' ➜</button>';
  else if(nextP) h+='<button class="btn" id="nx">לקטע הבא ➜</button>';
  h+='<button class="btn ghost" id="back">לרשימת הקטעים</button>';
  app.innerHTML=h; window.scrollTo(0,0);
  var b=document.getElementById('nx'); if(b) b.onclick=function(){ start(nextP.id); };
  b=document.getElementById('up'); if(b) b.onclick=function(){ S.view=p.lvl+1; save(); home(); };
  document.getElementById('back').onclick=home;
}
function ansHtml(a){ var ic={full:'✅',part:'🟡',no:'🔴',self:'✋'}[a.m]||''; return '<div class="pa"><b>'+ic+' '+esc(a.q)+'</b>'+esc(a.a)+'</div>'; }

/* ---------- הורים ---------- */
function parents(){
  var ids=Object.keys(S.done).sort(function(a,b){return S.done[b].t-S.done[a].t;});
  var h='<div class="card"><h2>להורים</h2><div style="font-size:16px;color:var(--soft)">כאן מופיעות התשובות שנכתבו, מהחדש לישן. ✅ מלאה · 🟡 חלקית · 🔴 לא נמצאה התשובה · ✋ הילד סימן שכתב את אותו רעיון במילים אחרות. '+
    'הבדיקה האוטומטית מחפשת את הרעיונות של התשובה בטקסט, והיא לא מושלמת. כדאי לקרוא את התשובות יחד.</div></div>';
  if(!ids.length) h+='<div class="card">עוד לא נכתבו תשובות.</div>';
  ids.forEach(function(id){ var p=PASSAGES.filter(function(x){return x.id===id;})[0], d=S.done[id]; if(!p) return;
    h+='<div class="card"><span class="pill">שלב '+p.lvl+' · '+new Date(d.t).toLocaleDateString('he-IL')+'</span><h3>'+p.em+' '+esc(p.title)+' — '+d.score+' מתוך '+d.max+'</h3>'+(d.ans||[]).map(ansHtml).join('')+'</div>'; });
  h+='<button class="btn ghost" id="back">חזרה</button>';
  app.innerHTML=h; window.scrollTo(0,0); document.getElementById('back').onclick=home;
}
window.addEventListener('lhcloud',function(){ if(!cur){ S=load(); home(); } });
window.READING={norm:norm,check:check,sentences:sentences,home:home,start:start};
home();
})();
</script>
